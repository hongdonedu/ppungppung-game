<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#8fd6ff;
    font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif; }
  #wrap { position:relative; width:100%; height:100vh; height:100dvh; overflow:hidden; }
  canvas { display:block; touch-action:none; }
  .hud { position:absolute; top:10px; left:0; right:0; display:flex; justify-content:space-between;
    align-items:flex-start; padding:0 8px; pointer-events:none; z-index:5; gap:5px; }
  .pill { background:rgba(255,255,255,.88); border-radius:18px; padding:5px 10px; font-weight:800;
    font-size:14px; color:#3a6a20; box-shadow:0 2px 0 rgba(0,0,0,.12); white-space:nowrap; }
  .pStat { display:flex; flex-direction:column; align-items:center; gap:1px; line-height:1.25; }
  .pStat .who { font-size:11px; letter-spacing:0; }
  .pStat .sc { font-size:14px; font-weight:900; }
  .pStat .hp { font-size:10px; letter-spacing:-0.5px; }
  .p1 .who { color:#b57845; }
  .p2 .who { color:#3d7fb8; }

  .roundPill { display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:5px 10px; font-size:12px; color:#5a3e2b; }

  .rb i { display:block; height:100%; width:100%; background:#8ede6f; border-radius:3px; }

  .overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; text-align:center; background:rgba(60,40,80,.45); z-index:10; padding:16px; }
  .board { z-index:12; }
  .card { background:#fffef5; border-radius:24px; padding:22px 22px; max-width:344px; width:100%;
    box-shadow:0 10px 0 rgba(0,0,0,.18); border:4px solid #5a3e2b; }
  .boardCard { max-width:370px; }
  .card h1 { font-size:25px; color:#5a3e2b; margin-bottom:6px; letter-spacing:-1px; }
  .card .emoji { font-size:38px; margin-bottom:2px; }

  .row .medal { width:34px; text-align:center; font-weight:900; font-size:14px; flex:none; }

  /* ---------- 타이틀 화면 (ChatGPT 키아트) ---------- */
  .titleScr { background:#6cc6ff url('assets/keyart.jpg') 62% center / cover no-repeat;

    background:linear-gradient(90deg, rgba(22,36,92,.82) 0%, rgba(22,36,92,.5) 34%, rgba(22,36,92,0) 60%); }
  .titleBox { position:relative; width:100%; max-width:360px; }
  .eyebrow { display:inline-block; color:#3a2a10; background:#ffe27a; font-size:13px; padding:4px 10px;

    text-shadow:0 4px 0 #2a2a6a, 0 9px 22px rgba(0,0,0,.35); }
  .logo .pp { color:#c6ff5e; display:inline-block; animation:wiggle 1.6s ease-in-out infinite; transform-origin:50% 80%; }

  @keyframes wiggle { 0%,100%{ transform:rotate(-4deg) scale(1);} 50%{ transform:rotate(4deg) scale(1.06);} }

  .titleBox .card { max-width:none; padding:16px 16px 18px; border-width:3px; text-align:center;
    background:rgba(255,254,245,.96); }

  @keyframes hop { from{ transform:translateY(0);} to{ transform:translateY(-8px);} }
  .card h1 { font-weight:400; }
  .btn, .modeBtn { font-weight:400; }
  @media (max-width: 700px), (orientation: portrait) {
    .titleScr { background-position:58% 18%; justify-content:flex-end; align-items:center; padding:14px 16px 18px; }
    .titleScr::before { background:linear-gradient(180deg, rgba(22,36,92,0) 0%, rgba(22,36,92,.15) 30%, rgba(22,36,92,.78) 62%, rgba(22,36,92,.9) 100%); }
    .titleBox { max-width:420px; }
    .logo { font-size:clamp(38px, 11vw, 56px); }
    .tag { font-size:14px; margin:6px 0 10px; }
  }
  @media (prefers-reduced-motion: reduce) { .logo .pp, .heroImgs img { animation:none; } }

<script>
'use strict';
// ================== 캔버스 ==================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const wrap = document.getElementById('wrap');
let W = 0, H = 0;
function resize(){
  W = wrap.clientWidth; H = wrap.clientHeight;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

const p1El = document.getElementById('p1El');
const p2El = document.getElementById('p2El');
const p1Who = document.getElementById('p1Who');
const p1Score = document.getElementById('p1Score');
const p2Score = document.getElementById('p2Score');
const p1Hearts = document.getElementById('p1Hearts');
const p2Hearts = document.getElementById('p2Hearts');
const roundTxt = document.getElementById('roundTxt');
const roundBar = document.getElementById('roundBar');
const nameInput = document.getElementById('nameInput');
const name2Input = document.getElementById('name2Input');
const startScr = document.getElementById('startScr');
const overScr = document.getElementById('overScr');
const winScr = document.getElementById('winScr');
const boardScr = document.getElementById('boardScr');

// ================== 유틸 ==================
const rnd = (a, b) => a + Math.random() * (b - a);
function pickWeighted(list){
  let tot = 0; for(const [, w] of list) tot += w;
  let r = Math.random() * tot;
  for(const [k, w] of list){ r -= w; if(r <= 0) return k; }
  return list[0][0];
}
function dateStr(){
  const d = new Date();
  return d.getFullYear() + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + String(d.getDate()).padStart(2, '0');
}

// ================== 사운드 ==================
let actx = null, muted = false;
function ensureAudio(){
  if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if(actx.state === 'suspended') actx.resume();
}
function noiseBuffer(dur){
  const len = Math.max(1, Math.floor(actx.sampleRate * dur));
  const buf = actx.createBuffer(1, len, actx.sampleRate);
  const d = buf.getChannelData(0);
  let last = 0;
  for(let i = 0; i < len; i++){
    const w = Math.random() * 2 - 1;
    last = (last + 0.02 * w) / 1.02;
    d[i] = last * 3.5;
  }
  return buf;
}

const FART_PRESETS = {
  normal:{ dur:[0.20,0.38], f0:[65,120],  lfo:[18,44], depth:26, sput:2, vol:0.50, lp:420 },
  big:   { dur:[0.75,1.05], f0:[55,95],   lfo:[14,28], depth:30, sput:6, vol:0.55, lp:380, slide:true },
  zig:   { dur:[0.38,0.55], f0:[95,135],  lfo:[5,7],   depth:60, sput:0, vol:0.45, lp:540 },
  homing:{ dur:[0.55,0.75], f0:[40,54],   lfo:[3.5,5], depth:10, sput:1, vol:0.50, lp:300 },
  split: { dur:[0.28,0.40], f0:[85,120],  lfo:[24,32], depth:30, sput:3, vol:0.48, lp:460 },
  freeze:{ dur:[0.30,0.45], f0:[95,125],  lfo:[30,40], depth:22, sput:2, vol:0.45, lp:700 },
  spiral:{ dur:[0.50,0.65], f0:[120,150], lfo:[3,4.2], depth:85, sput:0, vol:0.42, lp:620 },
  horn:  { dur:[0.80,0.95], f0:[68,78],   lfo:[6,8],   depth:12, sput:0, vol:0.50, lp:340 },
  boss:  { dur:[1.00,1.40], f0:[34,48],   lfo:[9,16],  depth:20, sput:7, vol:0.70, lp:320, slide:true }
};

function playFartP(name){
  if(!actx || muted) return;
  const P = FART_PRESETS[name] || FART_PRESETS.normal;
  const t = actx.currentTime;
  const dur = rnd(P.dur[0], P.dur[1]);
  const f0 = rnd(P.f0[0], P.f0[1]);
  const master = actx.createGain(); master.gain.value = P.vol; master.connect(actx.destination);

  const osc = actx.createOscillator(); osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(f0, t);
  osc.frequency.exponentialRampToValueAtTime(Math.max(30, f0 * 0.4), t + dur);
  const lfo = actx.createOscillator(); lfo.type = 'sine';
  lfo.frequency.setValueAtTime(rnd(P.lfo[0], P.lfo[1]), t);
  if(P.slide) lfo.frequency.linearRampToValueAtTime(P.lfo[0] * 0.5, t + dur);
  const lg = actx.createGain(); lg.gain.value = P.depth;
  lfo.connect(lg); lg.connect(osc.frequency);

  const og = actx.createGain();
  og.gain.setValueAtTime(0.0001, t);
  og.gain.exponentialRampToValueAtTime(0.9, t + 0.02);
  for(let i = 1; i <= P.sput; i++){
    const tt = t + dur * i / (P.sput + 1);
    og.gain.exponentialRampToValueAtTime(0.2 + Math.random() * 0.15, tt);
    og.gain.exponentialRampToValueAtTime(0.85, tt + dur / (P.sput * 2.2));
  }
  og.gain.exponentialRampToValueAtTime(0.0001, t + dur);

  const lp = actx.createBiquadFilter();
  lp.type = 'lowpass'; lp.frequency.value = P.lp; lp.Q.value = 2;
  osc.connect(lp); lp.connect(og); og.connect(master);
  osc.start(t); osc.stop(t + dur + 0.05);
  lfo.start(t); lfo.stop(t + dur + 0.05);

  const src = actx.createBufferSource(); src.buffer = noiseBuffer(dur);
  const ng = actx.createGain();
  ng.gain.setValueAtTime(0.0001, t);
  ng.gain.exponentialRampToValueAtTime(0.6, t + 0.02);
  ng.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  const nb = actx.createBiquadFilter();
  nb.type = 'bandpass'; nb.frequency.value = 280 + Math.random() * 250; nb.Q.value = 0.8;
  src.connect(nb); nb.connect(ng); ng.connect(master);
  src.start(t);
}

function note(freq, start, dur, type, vol, lpf){
  const o = actx.createOscillator(); o.type = type || 'triangle';
  o.frequency.setValueAtTime(freq, start);
  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, start);
  g.gain.exponentialRampToValueAtTime(vol || 0.2, start + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
  if(lpf){
    const f = actx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = lpf;
    o.connect(f); f.connect(g);
  } else o.connect(g);
  g.connect(actx.destination);
  o.start(start); o.stop(start + dur + 0.05);
}

function playToot(){
  if(!actx || muted) return;
  const t = actx.currentTime;
  const o = actx.createOscillator(); o.type = 'square';
  const f = 150 + Math.random() * 90;
  o.frequency.setValueAtTime(f, t);
  o.frequency.exponentialRampToValueAtTime(f * 0.6, t + 0.08);
  const g = actx.createGain();
  g.gain.setValueAtTime(0.18, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.09);
  const lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 800;
  o.connect(lp); lp.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t + 0.1);
}
function playPop(){
  if(!actx || muted) return;
  const t = actx.currentTime;
  const o = actx.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(400, t);
  o.frequency.exponentialRampToValueAtTime(170, t + 0.07);
  const g = actx.createGain();
  g.gain.setValueAtTime(0.22, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.08);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t + 0.09);
}
function playRocket(){
  if(!actx || muted) return;
  const t = actx.currentTime;
  const o = actx.createOscillator(); o.type = 'square';
  o.frequency.setValueAtTime(700, t);
  o.frequency.exponentialRampToValueAtTime(150, t + 0.16);
  const g = actx.createGain();
  g.gain.setValueAtTime(0.14, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.17);

let hasStorage = false, storeKind = '';
const SAVE_KEY = 'fart-dodge-save-v1';
let saveData = { lastName: '', lastName2: '', records: [] };
(async () => {
  let raw = null;
  if(typeof window !== 'undefined' && window.storage){
    storeKind = 'claude';
    try { const r = await window.storage.get(SAVE_KEY); raw = r && r.value; } catch(e){ /* 아직 기록 없음 */ }
  } else {
    try { raw = localStorage.getItem(SAVE_KEY); storeKind = 'local'; } catch(e){ storeKind = ''; }
  }
  hasStorage = !!storeKind;
  try {
    if(raw){
      const d = JSON.parse(raw);
      if(d && Array.isArray(d.records)) saveData = Object.assign(saveData, d);
    }
  } catch(e){}
  if(saveData.lastName) nameInput.value = saveData.lastName;
  if(saveData.lastName2) name2Input.value = saveData.lastName2;
})();
function persist(){
  const txt = JSON.stringify(saveData);
  if(storeKind === 'claude'){
    try { window.storage.set(SAVE_KEY, txt).catch(() => {}); } catch(e){}
  } else if(storeKind === 'local'){
    try { localStorage.setItem(SAVE_KEY, txt); } catch(e){}
  }
}

function syncMonsters(n){

  while(regs.length > n){

  }
  while(regs.length < n){
    const i = regs.length;
    const m = {
      x: Math.random() * (W - 120) + 60,
      y: 74 + Math.random() * 56,
      vx: (Math.random() < 0.5 ? -1 : 1) * (35 + Math.random() * 45),
      bob: Math.random() * 6.28,
      type: MONSTER_TYPES[i % MONSTER_TYPES.length],
      st: 'walk', timer: 0, kind: 'normal', flip: 1, tgtId: 0

    monsters.push(m); regs.push(m);
  }
}

const keys = { p1L:false, p1R:false, p2L:false, p2R:false };
function setKey(code, key, down){
  const k = (key || '').toLowerCase();
  // 1P: A·D (왼쪽 자리) / 2P: ← → (오른쪽 자리)
  if(code === 'KeyA' || k === 'a'){ keys.p1L = down; return true; }
  if(code === 'KeyD' || k === 'd'){ keys.p1R = down; return true; }
  if(code === 'ArrowLeft'  || k === 'arrowleft'){  if(mode === 2) keys.p2L = down; else keys.p1L = down; return true; }
  if(code === 'ArrowRight' || k === 'arrowright'){ if(mode === 2) keys.p2R = down; else keys.p1R = down; return true; }
  return false;
}
window.addEventListener('keydown', e => {
  const ae = document.activeElement;
  if(ae && ae.tagName === 'INPUT'){
    if(e.key === 'Enter' && !startScr.classList.contains('hidden')) startGame();
    return;
  }
  if(setKey(e.code, e.key, true)){ e.preventDefault(); return; }
  if(e.key === 'Enter' && boardScr.classList.contains('hidden')){
    if((state === 'start' && !startScr.classList.contains('hidden')) ||
       (state === 'over' && !overScr.classList.contains('hidden')) ||
       (state === 'win' && !winScr.classList.contains('hidden'))) startGame();
  }
});
window.addEventListener('keyup', e => { setKey(e.code, e.key, false); });

// 터치: 손가락마다 가까운 캐릭터를 조종 (2인용은 멀티터치 지원)
const drags = new Map(); // pointerId -> { pid, x }
function xOf(e){ return e.clientX - canvas.getBoundingClientRect().left; }
function assignDrag(px){
  const taken = new Set([...drags.values()].map(d => d.pid));
  let cand = alivePlayers().filter(p => !taken.has(p.id));
  if(!cand.length) cand = alivePlayers();
  if(!cand.length) return null;
  let best = cand[0], bd = 1e9;
  for(const p of cand){
    const d = Math.abs(p.x - px);
    if(d < bd){ bd = d; best = p; }
  }
  return best.id;
}
canvas.addEventListener('pointerdown', e => {
  const px = xOf(e);
  const pid = assignDrag(px);
  if(pid !== null) drags.set(e.pointerId, { pid, x: px });
});
canvas.addEventListener('pointermove', e => {
  const d = drags.get(e.pointerId);
  if(d) d.x = xOf(e);
});
window.addEventListener('pointerup', e => drags.delete(e.pointerId));
window.addEventListener('pointercancel', e => drags.delete(e.pointerId));

function dragXFor(p){
  for(const d of drags.values()) if(d.pid === p.id) return d.x;
  return null;
}
function movePlayers(dt){
  for(const p of players){
    p.y = H - 64;
    if(p.out){ p.downT += dt; continue; }
    const sf = p.slowT > 0 ? 0.45 : 1;
    const dx = dragXFor(p);
    let mv = 0;
    if(p.id === 0){ if(keys.p1L) mv -= 1; if(keys.p1R) mv += 1; }
    else { if(keys.p2L) mv -= 1; if(keys.p2R) mv += 1; }
    if(dx !== null){
      const d = dx - p.x;
      p.x += Math.sign(d) * Math.min(Math.abs(d), 520 * sf * dt);
      p.tilt = Math.max(-0.25, Math.min(0.25, d * 0.01));
    } else {
      p.x += mv * 340 * sf * dt;
      p.tilt += (mv * 0.22 - p.tilt) * 10 * dt;
    }
    p.x = Math.max(p.r + 6, Math.min(W - p.r - 6, p.x));
  }
}

// ================== 게임 로직 ==================
function update(rdt){
  const cfg = ROUNDS[round];
  if(slowMoT > 0) slowMoT -= rdt;
  const dt = rdt * (slowMoT > 0 ? 0.45 : 1); // ⏰ 시계 아이템 = 세상이 느려짐 (내 몸은 그대로!)
  movePlayers(rdt);
  for(const p of players){
    if(p.out) continue;
    addScore(p, rdt * 2);
    if(p.invuln > 0) p.invuln -= rdt;
    if(p.slowT > 0) p.slowT -= rdt;
    if(p.feverT > 0) p.feverT -= rdt;
  }

  // 라운드 타이머
  roundLeft -= rdt;
  if(roundLeft <= 0){
    if(round >= FINAL_ROUND){ victory(); return; }
    let bonus = 50 * round;
    if(round === 10 || round === 20){ // 보스 격파!
      bonus += round === 10 ? 300 : 500;
      if(boss){
        spawnPuffs(boss.x, boss.y, 18, round === 10 ? '#ffd9b0' : '#dcc8ff');
        particles.push({ x: boss.x, y: boss.y, text: round === 10 ? '으악~ 도망간다!' : '분하다! 또 보자~!', life: 1.3, max: 1.3, color: round === 10 ? '#c06a20' : '#6b2ba0' });
        monsters.splice(monsters.indexOf(boss), 1);
        boss = null;
      }
      for(const p of players){ if(!p.out) p.hearts = p.maxHearts; }
      particles.push({ x: W / 2, y: H * 0.42 - 40, text: round === 10 ? '중간 보스 격파!' : '대마왕 격파!', life: 1.6, max: 1.6, big: true, color: '#8a4aa0' });
      particles.push({ x: W / 2, y: H * 0.66, text: '❤️ 하트 모두 회복!', life: 1.6, max: 1.6, big: true, color: '#e2574c' });
    }
    for(const p of players) if(!p.out) addScore(p, bonus);
    for(let ci = 0; ci < 18; ci++) confetti.push(makeConfetti(Math.random() * W, -10));
    particles.push({ x: W / 2, y: H * 0.42, text: '라운드 클리어! +' + bonus, life: 1.5, max: 1.5, big: true, color: '#e6a817' });
    playClearJingle();
    startRound(round + 1);
    return;
  }

  // 몬스터
  for(const m of monsters){
    if(m.isBoss) continue;
    m.bob += dt * 4;
    if(m.st === 'walk'){
      m.x += m.vx * dt;
      if(m.x < 40){ m.x = 40; m.vx = Math.abs(m.vx); }
      if(m.x > W - 40){ m.x = W - 40; m.vx = -Math.abs(m.vx); }
      m.flip = m.vx >= 0 ? 1 : -1;
    } else if(m.st === 'charge'){
      m.timer -= dt;
      if(m.timer <= 0) doFart(m);
    } else if(m.st === 'fart'){
      m.timer -= dt;
      if(m.timer <= 0){
        m.st = 'walk';
        m.vx = (Math.random() < 0.5 ? -1 : 1) * (35 + Math.random() * 55);
      }
    } else if(m.st === 'rapid'){
      m.shotT -= dt;
      if(m.shotT <= 0){
        playToot();
        spawnCloud(m.x, m.y + 20, 'small', cfg.speed, undefined, pickTarget());
        spawnPuffs(m.x, m.y + 18, 2);
        m.shots--; m.shotT = 0.14;
        if(m.shots <= 0){ m.st = 'fart'; m.timer = 0.25; }
      }
    } else if(m.st === 'snakefire'){ // 🐍 줄줄이 뱀 방귀
      m.shotT -= dt;
      if(m.shotT <= 0){
        clouds.push({ x: m.snX, y: m.y + 20, kind: 'snakeb', vx: 0, vy: m.snVy, r: 13, zig: 115, grav: 0,
                      age: 0, wob: Math.random() * 6.28, ph: m.snPh, tgtId: 0 });
        m.shots--; m.shotT = 0.16;
        if(m.shots <= 0){ m.st = 'fart'; m.timer = 0.25; }
      }
    }
  }

  // 보스
  if(boss){
    boss.sway += dt;
    boss.x = W / 2 + Math.sin(boss.sway * 0.8) * (W * 0.16);
    boss.bob += dt * 3;
    if(boss.boss2 && !boss.enraged && roundLeft < roundTime * 0.5){
      boss.enraged = true;
      shake = 10;
      playFartP('boss');
      particles.push({ x: W / 2, y: 220, text: '대마왕이 화났다!!', life: 1.4, max: 1.4, big: true, color: '#c0392b' });
    }
    if(boss.boss3){
      const ph = roundLeft < roundTime / 3 ? 2 : roundLeft < roundTime * 2 / 3 ? 1 : 0;
      if(ph > (boss.phase || 0)){
        boss.phase = ph; boss.enraged = true;
        shake = 11;
        playFartP('boss');
        particles.push({ x: W / 2, y: 220, text: ph === 1 ? '뿡뿡제왕이 분노했다!!' : '뿡뿡제왕 최후의 발악!!!', life: 1.5, max: 1.5, big: true, color: '#c0392b' });
      }
    }
    if(boss.st === 'idle'){
      boss.timer -= dt;
      if(boss.timer <= 0){
        boss.st = 'charge'; boss.ctimer = boss.boss2 ? 0.55 : 0.6;
        const r = Math.random();
        if(boss.boss3){
          let pool = ['fan9', 'homing4', 'bomb3', 'megarapid', 'wall', 'light3'];
          if((boss.phase || 0) >= 1) pool = pool.concat(['storm', 'light3']);
          if((boss.phase || 0) >= 2) pool = pool.concat(['meteor', 'meteor', 'storm']);
          boss.attack = pool[(Math.random() * pool.length) | 0];
        } else if(boss.boss2){
          if(!boss.enraged){
            boss.attack = r < 0.24 ? 'fan7' : r < 0.46 ? 'homing3' : r < 0.64 ? 'bombdrop' : r < 0.84 ? 'megarapid' : 'wall';
          } else {
            boss.attack = r < 0.2 ? 'fan7' : r < 0.36 ? 'homing3' : r < 0.5 ? 'bombdrop' : r < 0.68 ? 'megarapid' : r < 0.84 ? 'wall' : 'storm';
          }
        } else {
          boss.attack = r < 0.4 ? 'fan' : r < 0.7 ? 'rapid' : 'giant';
        }
      }
    } else if(boss.st === 'charge'){
      boss.ctimer -= dt;
      if(boss.ctimer <= 0) bossAttack();
    } else if(boss.st === 'post'){
      boss.ctimer -= dt;
      if(boss.ctimer <= 0){
        boss.st = 'idle';
        if(boss.boss3){
          const ph = boss.phase || 0;
          boss.timer = (ph >= 2 ? 0.95 : ph >= 1 ? 1.2 : 1.5) + Math.random() * 0.5;
        } else if(boss.boss2) boss.timer = (boss.enraged ? 1.15 : 1.5) + Math.random() * (boss.enraged ? 0.5 : 0.7);
        else boss.timer = 1.9 + Math.random() * 0.8;
      }
    } else if(boss.st === 'rapid'){
      boss.shotT -= dt;
      if(boss.shotT <= 0){
        playToot();
        spawnCloud(boss.x, boss.y + (boss.boss3 ? 52 : boss.boss2 ? 48 : 42), 'small', cfg.speed, undefined, pickTarget());
        spawnPuffs(boss.x, boss.y + 42, 2);
        boss.shots--; boss.shotT = 0.13;
        if(boss.shots <= 0){ boss.st = 'post'; boss.ctimer = 0.4; }
      }
    } else if(boss.st === 'meteor'){ // ☄️ 방귀 유성우
      boss.shotT -= dt;
      if(boss.shotT <= 0){
        playToot();
        const mx = rnd(24, W - 24);
        clouds.push({ x: mx, y: -20, kind: 'small', vx: rnd(-15, 15), vy: 190 + Math.random() * 70,
                      r: 12, grav: 30, age: 0, wob: Math.random() * 6.28, ph: Math.random() * 6.28, tgtId: 0 });
        spawnPuffs(mx, -6, 1, '#ffd9a0');
        boss.shots--; boss.shotT = 0.17;
        if(boss.shots <= 0){ boss.st = 'post'; boss.ctimer = 0.5; }
      }
    }
  }

  // 방귀 예약
  nextFart -= dt;
  if(nextFart <= 0){
    const free = monsters.filter(m => !m.isBoss && m.st === 'walk');
    if(free.length){
      const m = free[(Math.random() * free.length) | 0];
      let k = pickWeighted(cfg.kinds);
      if(k === 'normal' && Math.random() < cfg.big) k = 'big';
      m.kind = k; m.st = 'charge'; m.tgtId = pickTarget().id;
      if(k === 'lightning'){
        const tp = players[m.tgtId];
        m.aimX = Math.max(26, Math.min(W - 26, tp ? tp.x : W / 2));
      }
      m.timer = k === 'rocket' ? 0.65 : k === 'lightning' ? 0.8
              : (k === 'homing' || k === 'bomb' || k === 'boomerang' || k === 'snake') ? 0.5 : 0.45;
    }
    nextFart = cfg.interval * (0.7 + Math.random() * 0.6);
  }

  // 아이템 방귀
  if(cfg.rainbow){
    rainbowT -= dt;
    if(rainbowT <= 0){
      const regs = monsters.filter(m => !m.isBoss);
      if(regs.length){
        const src = regs[(Math.random() * regs.length) | 0];
        spawnCloud(src.x, src.y + 20, 'rainbow', 1);
        playCuteToot();
        particles.push({ x: src.x, y: src.y + 14, text: '뾰로롱~', life: 0.9, color: '#e078b8' });
        spawnPuffs(src.x, src.y + 18, 4, '#ffe0f0');
      }
      rainbowT = 7 + Math.random() * 5;
    }
  }
  if(cfg.gold){
    goldT -= dt;
    if(goldT <= 0){
      const regs = monsters.filter(m => !m.isBoss);
      if(regs.length){
        const src = regs[(Math.random() * regs.length) | 0];
        spawnCloud(src.x, src.y + 20, 'gold', 1);
        playCoin();
        particles.push({ x: src.x, y: src.y + 14, text: '띠링!', life: 0.9, color: '#e8a020' });
      }
      goldT = 9 + Math.random() * 4;
    }
  }
  if(cfg.shield && alivePlayers().some(p => !p.shield)){
    shieldT -= dt;
    if(shieldT <= 0){
      const regs = monsters.filter(m => !m.isBoss);
      if(regs.length){
        const src = regs[(Math.random() * regs.length) | 0];
        spawnCloud(src.x, src.y + 20, 'shield', 1);
        playBubbles();
        particles.push({ x: src.x, y: src.y + 14, text: '보글보글~', life: 0.9, color: '#3a8ac0' });
      }
      shieldT = 12 + Math.random() * 5;
    }
  }
  // ⏰ 시계 방귀 (슬로우 모션 아이템)
  if(cfg.clock){
    clockT -= dt;
    if(clockT <= 0){
      const regs = monsters.filter(m => !m.isBoss);
      if(regs.length){
        const src = regs[(Math.random() * regs.length) | 0];
        spawnCloud(src.x, src.y + 20, 'clock', 1);
        playTicktock();
        particles.push({ x: src.x, y: src.y + 14, text: '째깍째깍~', life: 0.9, color: '#4a7ab8' });
      }
      clockT = 13 + Math.random() * 5;
    }
  }
  // 🍀 클로버 방귀 (점수 x2 피버)
  if(cfg.clover){
    cloverT -= dt;
    if(cloverT <= 0){
      const regs = monsters.filter(m => !m.isBoss);
      if(regs.length){
        const src = regs[(Math.random() * regs.length) | 0];
        spawnCloud(src.x, src.y + 20, 'clover', 1);
        playLucky();
        particles.push({ x: src.x, y: src.y + 14, text: '반짝~', life: 0.9, color: '#3fae5c' });
      }
      cloverT = 14 + Math.random() * 5;
    }
  }
  // ☔ 방귀 소나기
  if(cfg.rain){
    rainT -= dt;
    if(rainT <= 0){
      playRainSfx();
      particles.push({ x: W / 2, y: H * 0.3, text: '☔ 방귀 소나기!', life: 1.3, max: 1.3, big: true, color: '#3a8ac0' });
      for(let ri = 0; ri < 12; ri++){
        clouds.push({ x: rnd(20, W - 20), y: -20 - ri * 38, kind: 'small', vx: rnd(-15, 15),
                      vy: 120 + Math.random() * 50, r: 11, grav: 4,
                      age: 0, wob: Math.random() * 6.28, ph: Math.random() * 6.28, tgtId: 0 });
      }
      rainT = (cfg.rainEvery || 10) + rnd(-2, 2);
    }
  }
  // ⚡ 번개 경고 처리 (보스3의 삼연속 번개)
  for(let li = lightWarns.length - 1; li >= 0; li--){
    const lw = lightWarns[li];
    lw.t -= dt;
    if(lw.t <= 0){
      lightWarns.splice(li, 1);
      playZap(); shake = 5;
      for(let bi = 0; bi < 3; bi++){
        clouds.push({ x: lw.x, y: -20 - bi * 46, kind: 'bolt', vx: 0, vy: 520, r: 13, grav: 0,
                      age: 0, wob: Math.random() * 6.28, ph: Math.random() * 6.28, tgtId: 0 });
      }
    }
  }
  // 안개벽
  if(cfg.wall){
    wallT -= dt;
    if(wallT <= 0){
      startWallWarn();
      wallT = cfg.wallEvery + rnd(-1.5, 1.5);
    }
  }
  if(wallPending){
    wallWarnT -= dt;
    if(wallWarnT <= 0){ spawnWall(); wallPending = false; }
  }

  // 방귀 구름
  for(let i = clouds.length - 1; i >= 0; i--){
    const c = clouds[i];
    c.age += dt; c.wob += dt * 5;
    if(c.zig) c.x += Math.sin(c.age * 5.5 + c.ph) * c.zig * dt;
    if(c.home){
      const tp = targetOf(c);
      const dir = tp.x > c.x ? 1 : -1;
      c.vx += dir * c.home * dt;
      if(c.vx > c.hmax) c.vx = c.hmax;
      if(c.vx < -c.hmax) c.vx = -c.hmax;
    }
    if(c.kind === 'rainbow') c.x += Math.sin(c.age * 2 + c.ph) * 42 * dt;
    if(c.kind === 'gold') c.x += Math.sin(c.age * 2.6 + c.ph) * 55 * dt;
    if(c.kind === 'shield' || c.kind === 'clock' || c.kind === 'clover') c.x += Math.sin(c.age * 1.8 + c.ph) * 35 * dt;
    if(c.kind === 'spiral') c.x = c.cx + Math.sin(c.age * 3.6 + c.ph) * Math.min(130, 18 + c.age * 60);
    if(c.bnc > 0){ // 🏓 통통 방귀: 벽에 튕김
      if(c.x < c.r + 4 && c.vx < 0){ c.vx = -c.vx; c.bnc--; playBoing(); spawnPuffs(c.r + 6, c.y, 3, '#ffd0da'); }
      else if(c.x > W - c.r - 4 && c.vx > 0){ c.vx = -c.vx; c.bnc--; playBoing(); spawnPuffs(W - c.r - 6, c.y, 3, '#ffd0da'); }
    }
    c.x += c.vx * dt; c.y += c.vy * dt; c.vy += (c.grav || 0) * dt;

    // 폭탄
    if(c.kind === 'bomb'){
      c.fuseT -= dt;
      if(c.fuseT <= 0){ playTick(); c.fuseT = 0.34; }
      if(c.y >= c.splitY){
        clouds.splice(i, 1);
        playBoom(); shake = 7;
        spawnPuffs(c.x, c.y, 10, '#ffcf9a');
        particles.push({ x: c.x, y: c.y, text: '펑!!', life: 0.8, color: '#c25a1a' });
        for(let k2 = 0; k2 < 8; k2++){
          const ang = k2 * Math.PI / 4 + rnd(-0.1, 0.1);
          const sp = 165 * ROUNDS[round].speed;
          clouds.push({ x: c.x, y: c.y, kind: 'small', vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
                        r: 12, grav: 70, age: 0, wob: Math.random() * 6.28, ph: Math.random() * 6.28, tgtId: 0 });
        }
        continue;
      }
    }
    // 분열
    if(c.kind === 'split' && c.y >= c.splitY){
      clouds.splice(i, 1);
      playPop();
      spawnPuffs(c.x, c.y, 5, '#ffe2b8');
      for(const s of [-1, 1]){
        clouds.push({ x: c.x, y: c.y, kind: 'small', vx: s * (85 + Math.random() * 55), vy: c.vy * 0.9 + 30,
                      r: 13, grav: 16, age: 0, wob: Math.random() * 6.28, ph: Math.random() * 6.28, tgtId: 0 });
      }
      continue;
    }
    // 화면 밖 = 피함!
    if(c.y > H + 40 || c.x < -70 || c.x > W + 70 || c.y < -90){
      clouds.splice(i, 1);
      if(c.kind === 'wallseg'){
        for(const p of alivePlayers()) addScore(p, 3);
      } else if(!['rainbow', 'gold', 'shield', 'clock', 'clover', 'fake'].includes(c.kind)){
        dodged++;
        for(const p of alivePlayers()){
          addScore(p, 10); p.streak++;
          if(p.streak % 15 === 0){
            addScore(p, 40);
            playCombo();
            particles.push({ x: p.x, y: p.y - 72, text: p.streak + '콤보! +40', life: 1.1, max: 1.1, color: '#e6a817' });
          }
        }
        if(dodged >= dodgeMile){ // 🎯 누적 회피 보너스
          for(const p of alivePlayers()) addScore(p, 80);
          particles.push({ x: W / 2, y: H * 0.5, text: '🎯 누적 회피 ' + dodgeMile + '개! +80', life: 1.5, max: 1.5, big: true, color: '#e6a817' });
          playCombo(); playSparkle();
          dodgeMile += 50;
        }
      }
      continue;
    }
    // 충돌 판정 (플레이어별)
    let gone = false;
    for(const p of players){
      if(p.out) continue;
      const dx = c.x - p.x, dy = c.y - (p.y - 4);
      const d2 = dx * dx + dy * dy;
      if(c.kind === 'rainbow'){
        const rr = c.r + p.r;
        if(d2 < rr * rr){
          gone = true;
          addScore(p, 50);
          const downMate = players.find(q => q.out);
          if(downMate){ // 협동! 쓰러진 친구 부활
            downMate.out = false; downMate.hearts = 1; downMate.invuln = 2;
            downMate.x = Math.max(40, Math.min(W - 40, p.x + 60));
            playRevive();
            particles.push({ x: downMate.x, y: downMate.y - 60, text: downMate.name + ' 부활!', life: 1.6, max: 1.6, big: true, color: '#e2574c' });
          } else if(p.hearts < p.maxHearts){
            p.hearts++;
            particles.push({ x: p.x, y: p.y - 40, text: '+❤️', life: 1, color: '#e2574c' });
          }
          particles.push({ x: p.x, y: p.y - 62, text: '+50', life: 1, color: '#e078b8' });
          playSparkle();
          spawnPuffs(p.x, p.y - 10, 8, '#ffd9ec');
        }
      } else if(c.kind === 'gold'){
        const rr = c.r + p.r;
        if(d2 < rr * rr){
          gone = true;
          addScore(p, 100);
          particles.push({ x: p.x, y: p.y - 62, text: '+100!', life: 1.1, max: 1.1, big: true, color: '#e8a020' });
          playCoinGet();
          spawnPuffs(p.x, p.y - 10, 8, '#ffe9b0');
        }
      } else if(c.kind === 'shield'){
        const rr = c.r + p.r;
        if(d2 < rr * rr){
          gone = true;
          if(!p.shield){
            p.shield = true;
            particles.push({ x: p.x, y: p.y - 56, text: '🛡 방패 획득!', life: 1.1, color: '#3a8ac0' });
            playShieldGet();
          } else {
            addScore(p, 30);
            particles.push({ x: p.x, y: p.y - 56, text: '+30', life: 1, color: '#3a8ac0' });
            playCoin();
          }
          spawnPuffs(p.x, p.y - 10, 6, '#cfe8ff');
        }
      } else if(c.kind === 'clock'){
        const rr = c.r + p.r;
        if(d2 < rr * rr){
          gone = true;
          slowMoT = 3.2;
          particles.push({ x: p.x, y: p.y - 60, text: '⏰ 시간아 천천히~!', life: 1.3, max: 1.3, big: true, color: '#4a7ab8' });
          playClockGet();
          spawnPuffs(p.x, p.y - 10, 8, '#cfe0ff');
        }
      } else if(c.kind === 'clover'){
        const rr = c.r + p.r;
        if(d2 < rr * rr){
          gone = true;
          p.feverT = 8;
          particles.push({ x: p.x, y: p.y - 60, text: '🍀 피버 타임! ×2', life: 1.3, max: 1.3, big: true, color: '#3fae5c' });
          playFever();
          spawnPuffs(p.x, p.y - 10, 8, '#d0f0d8');
        }
      } else if(c.kind === 'fake'){
        const rr = c.r + p.r - 4;
        if(d2 < rr * rr){
          gone = true;
          addScore(p, 5);
          particles.push({ x: p.x, y: p.y - 56, text: '속았지~? +5', life: 1, color: '#7a9a4a' });
          playFakeFart();
          spawnPuffs(p.x, p.y - 12, 6, '#e6f2c8');
        }
      } else if(c.kind === 'freeze'){
        if(p.invuln <= 0){
          const rr = c.r + p.r - 6;
          if(d2 < rr * rr){
            gone = true;
            p.slowT = 2.6; p.invuln = 0.8; shake = 4;
            playFreezeHit();
            particles.push({ x: p.x, y: p.y - 46, text: '꽁꽁!', life: 1, color: '#2f86c8' });
            spawnPuffs(p.x, p.y, 7, '#d8f2ff');
          }
        }
      } else {
        if(p.invuln <= 0){
          const rr = c.r + p.r - 8;
          if(d2 < rr * rr){
            gone = true;
            hitPlayer(p);
          }
        }
      }
      if(gone) break;
    }
    if(gone) clouds.splice(i, 1);
  }

  updateHUD();
}

function startWallWarn(){
  if(wallPending) return;
  wallPending = true; wallWarnT = 1.0;
  // 구멍 4개! 화면을 4구역으로 나눠 구역마다 하나씩 (골고루 퍼지게)
  wallGapHalf = Math.max(34, Math.min(50, W / 8 - 6));
  wallGaps = [];
  for(let z = 0; z < 4; z++){
    const z0 = (W / 4) * z, z1 = (W / 4) * (z + 1);
    const lo = z0 + wallGapHalf + 4, hi = Math.max(lo, z1 - wallGapHalf - 4);
    wallGaps.push(rnd(lo, hi));
  }
  playHorn();
}
function spawnWall(){
  const vy = 88 + round;
  for(let x = 22; x < W - 10; x += 44){
    let inGap = false;
    for(const g of wallGaps){ if(Math.abs(x - g) <= wallGapHalf){ inGap = true; break; } }
    if(inGap) continue;
    clouds.push({ x, y: -26, kind: 'wallseg', vx: 0, vy, r: 20, grav: 0,
                  age: 0, wob: Math.random() * 6.28, ph: Math.random() * 6.28, tgtId: 0 });
  }
}

function bossAttack(){
  const mul = ROUNDS[round].speed;
  const by = boss.boss3 ? 52 : boss.boss2 ? 48 : 42;
  spawnPuffs(boss.x, boss.y + by, 10);
  if(boss.boss3){
    const a = boss.attack;
    if(a === 'fan9'){
      playFartP('boss'); shake = 11;
      particles.push({ x: boss.x, y: boss.y + 36, text: '뿌아아아아앙!!!', life: 1, max: 1, big: true, color: '#a8321e' });
      for(let i = 0; i < 9; i++){
        const ang = Math.PI * (0.20 + 0.075 * i);
        spawnCloud(boss.x, boss.y + by, 'normal', mul * 0.95, ang);
      }
      boss.st = 'post'; boss.ctimer = 0.5;
    } else if(a === 'homing4'){
      playFartP('homing'); shake = 8;
      particles.push({ x: boss.x, y: boss.y + 36, text: '스멀스멀스멀…', life: 1, color: '#5a2a8a' });
      for(let i = 0; i < 4; i++) spawnCloud(boss.x + (i - 1.5) * 34, boss.y + by, 'homing', mul, undefined, pickTarget());
      boss.st = 'post'; boss.ctimer = 0.5;
    } else if(a === 'bomb3'){

function doFart(m){
  const cfg = ROUNDS[round], mul = cfg.speed;
  const k = m.kind;
  const tgt = (players[m.tgtId] && !players[m.tgtId].out) ? players[m.tgtId] : pickTarget();
  if(k === 'rapid'){
    m.st = 'rapid'; m.shots = round >= 8 ? 6 : 4; m.shotT = 0;
    particles.push({ x: m.x, y: m.y + 16, text: '뿡뿡뿡뿡!', life: 0.9 });
    shake = 2;
    return;
  }
  m.st = 'fart'; m.timer = 0.35;
  spawnPuffs(m.x, m.y + 20, 6);
  let txt = FART_TEXTS[(Math.random() * FART_TEXTS.length) | 0];
  switch(k){
    case 'big': {
      playFartP('big'); shake = 6; txt = '뿌우우웅!!!';
      const aim = aimAt(m.x, m.y + 22, tgt);
      for(let i = -1; i <= 1; i++) spawnCloud(m.x, m.y + 22, 'big', mul, aim + i * 0.35, tgt);
      break;
    }
    case 'zig':       playFartP('zig');    shake = 2.5; txt = '뿌에에엥~';  spawnCloud(m.x, m.y + 22, 'zig', mul, undefined, tgt); break;
    case 'homing':    playFartP('homing'); shake = 3;   txt = '스멀스멀…'; spawnCloud(m.x, m.y + 22, 'homing', mul, undefined, tgt); break;
    case 'split':     playFartP('split');  shake = 3;   txt = '뿌지직!';   spawnCloud(m.x, m.y + 22, 'split', mul, undefined, tgt); break;
    case 'rocket':    playRocket();        shake = 3;   txt = '쀼슝!!';    spawnCloud(m.x, m.y + 22, 'rocket', mul, undefined, tgt); break;
    case 'freeze':    playFreezeFart();    shake = 3;   txt = '꽁꽁뿡!';   spawnCloud(m.x, m.y + 22, 'freeze', mul, undefined, tgt); break;
    case 'ghost':     playGhostFart();     shake = 2;   txt = '우우웅~';   spawnCloud(m.x, m.y + 22, 'ghost', mul, undefined, tgt); break;
    case 'bomb':      playFartP('split');  playTick(); shake = 3; txt = '째깍째깍…'; spawnCloud(m.x, m.y + 22, 'bomb', mul, undefined, tgt); break;
    case 'spiral':    playFartP('spiral'); shake = 3;   txt = '빙글빙글~'; spawnCloud(m.x, m.y + 22, 'spiral', mul, undefined, tgt); break;
    case 'boomerang': playBoomerangS();    shake = 3;   txt = '뿌융뿌융!'; spawnCloud(m.x, m.y + 22, 'boomerang', mul, undefined, tgt); break;
    case 'lightning': { // ⚡ 예고된 기둥으로 번개 낙하!
      playZap(); shake = 4; txt = '번쩍!!';
      const lx = m.aimX !== undefined ? m.aimX : Math.max(26, Math.min(W - 26, tgt.x));
      for(let bi = 0; bi < 3; bi++){
        clouds.push({ x: lx, y: -20 - bi * 46, kind: 'bolt', vx: 0, vy: 520, r: 13, grav: 0,
                      age: 0, wob: Math.random() * 6.28, ph: Math.random() * 6.28, tgtId: 0 });
      }
      break;
    }
    case 'fake':      playFakeFart();      shake = 1.5; txt = '뿡...?';   spawnCloud(m.x, m.y + 22, 'fake', mul, undefined, tgt); break;
    case 'bounce':    playBoing();         shake = 3;   txt = '통통!';    spawnCloud(m.x, m.y + 22, 'bounce', mul, undefined, tgt); break;
    case 'snake': { // 🐍 같은 길로 줄줄이 5발
      playSnake(); shake = 3;
      m.st = 'snakefire'; m.shots = 5; m.shotT = 0;
      m.snPh = Math.random() * 6.28; m.snX = m.x; m.snVy = (140 + Math.random() * 20) * mul * 0.85;
      particles.push({ x: m.x, y: m.y + 18, text: '스르릉~', life: 0.9 });
      return;
    }
    default:          playFartP('normal'); shake = 2.5;                    spawnCloud(m.x, m.y + 22, 'normal', mul, undefined, tgt);
  }
  particles.push({ x: m.x, y: m.y + 18, text: txt, life: 0.9 });
}

function spawnCloud(x, y, kind, mul, ang, tgt){
  const tp = tgt || pickTarget();
  const c = { x, y, kind, age: 0, wob: Math.random() * 6.28, ph: Math.random() * 6.28,
              grav: 0, vx: 0, vy: 0, r: 16, tgtId: tp.id };
  const aim = (ang !== undefined) ? ang : aimAt(x, y, tp);
  switch(kind){
    case 'big': {
      const sp = (140 + Math.random() * 55) * mul;
      c.vx = Math.cos(aim) * sp; c.vy = Math.abs(Math.sin(aim)) * sp;
      c.r = 20; c.grav = 25; break;
    }
    case 'small': {
      const a = aim + rnd(-0.15, 0.15);
      const sp = (215 + Math.random() * 45) * mul;
      c.vx = Math.cos(a) * sp; c.vy = Math.abs(Math.sin(a)) * sp;
      c.r = 12; c.grav = 12; break;
    }
    case 'zig':
      c.vy = (135 + Math.random() * 30) * mul; c.r = 15; c.zig = 140 + Math.random() * 50; break;
    case 'homing':
      c.vx = rnd(-40, 40); c.vy = (112 + Math.random() * 22) * mul; c.r = 16; c.home = 270; c.hmax = 175; break;
    case 'split': {
      const sp = (140 + Math.random() * 40) * mul;
      c.vx = Math.cos(aim) * sp; c.vy = Math.abs(Math.sin(aim)) * sp;
      c.r = 18; c.grav = 18; c.splitY = H * 0.42 + Math.random() * 70; break;
    }
    case 'rocket': {
      const sp = (355 + Math.random() * 45) * mul;
      c.vx = Math.cos(aim) * sp; c.vy = Math.abs(Math.sin(aim)) * sp;
      c.r = 11; break;
    }
    case 'giant':
      c.vy = 125 * mul; c.r = 27; c.home = 130; c.hmax = 95; break;
    case 'freeze': {
      const a = aim + rnd(-0.06, 0.06);
      const sp = (150 + Math.random() * 40) * mul * 0.9;
      c.vx = Math.cos(a) * sp; c.vy = Math.abs(Math.sin(a)) * sp;
      c.r = 16; c.grav = 22; break;
    }
    case 'ghost': {
      const a = aim + rnd(-0.05, 0.05);
      const sp = (135 + Math.random() * 30) * mul * 0.85;
      c.vx = Math.cos(a) * sp; c.vy = Math.abs(Math.sin(a)) * sp;
      c.r = 16; c.grav = 8; break;
    }
    case 'bomb': {
      const sp = (150 + Math.random() * 25) * mul;
      c.vx = Math.cos(aim) * sp * 0.55; c.vy = Math.abs(Math.sin(aim)) * sp * 0.8;
      c.r = 17; c.grav = 30; c.splitY = H * (0.40 + Math.random() * 0.2); c.fuseT = 0.32; break;
    }
    case 'spiral':
      c.cx = Math.max(80, Math.min(W - 80, x));
      c.vy = (118 + Math.random() * 22) * mul * 0.9; c.r = 15; break;
    case 'boomerang': {
      const a = aim + rnd(-0.1, 0.1);
      const sp = (235 + Math.random() * 35) * mul;
      c.vx = Math.cos(a) * sp * 0.5; c.vy = Math.abs(Math.sin(a)) * sp;
      c.r = 15; c.grav = -175; break;
    }
    case 'gold':
      c.vx = rnd(-30, 30); c.vy = 150; c.r = 15; break;
    case 'shield':
      c.vx = rnd(-20, 20); c.vy = 72; c.r = 15; break;
    case 'rainbow':
      c.vx = rnd(-25, 25); c.vy = 88; c.r = 17; break;
    case 'clock':
      c.vx = rnd(-20, 20); c.vy = 70; c.r = 15; break;
    case 'clover':
      c.vx = rnd(-20, 20); c.vy = 78; c.r = 15; break;
    case 'fake': {
      const a = aim + rnd(-0.1, 0.1);
      const sp = (145 + Math.random() * 45) * mul * 0.95;
      c.vx = Math.cos(a) * sp; c.vy = Math.abs(Math.sin(a)) * sp; c.grav = 26; break;
    }
    case 'bounce': {
      const dir = tp.x > x ? 1 : -1;
      c.vx = dir * (150 + Math.random() * 60) * mul;
      c.vy = (120 + Math.random() * 25) * mul;
      c.r = 15; c.grav = 8; c.bnc = 2; break;
    }
    default: {
      const a = aim + rnd(-0.08, 0.08);
      const sp = (150 + Math.random() * 60) * mul;
      c.vx = Math.cos(a) * sp; c.vy = Math.abs(Math.sin(a)) * sp; c.grav = 30;
    }
  }
  clouds.push(c);
}

function spawnPuffs(x, y, n, col){
  for(let i = 0; i < n; i++){
    puffs.push({
      x: x + rnd(-12, 12), y: y + rnd(-6, 10),
      r: 4 + Math.random() * 6, life: 0.4 + Math.random() * 0.2,
      col: col || '#d6f0a8'
    });
  }
}

function hitPlayer(p){
  if(p.shield){
    p.shield = false; p.invuln = 1.0; shake = 5;
    playBubblePop();
    particles.push({ x: p.x, y: p.y - 46, text: '방패가 지켜줬다!', life: 1, color: '#3a8ac0' });
    spawnPuffs(p.x, p.y, 8, '#cfe8ff');
    return;
  }
  p.hearts--; p.streak = 0; p.invuln = 1.4; shake = 8; p.face = 1;
  playHit();
  if(p.hearts === 1){
    particles.push({ x: p.x, y: p.y - 78, text: '⚠️ 위험! ❤️ 1개!', life: 1.4, max: 1.4, big: true, color: '#e2352c' });
    playAlert();
  }
  setTimeout(() => { p.face = 0; }, 700);
  if(p.hearts <= 0){
    p.out = true; p.downT = 0; p.shield = false; p.slowT = 0;
    playDown();
    particles.push({ x: p.x, y: p.y - 56, text: (mode === 2 ? p.name + ' 쓰러짐!' : '쓰러졌다!'), life: 1.4, max: 1.4, big: true, color: '#8a6a55' });
    if(mode === 2 && alivePlayers().length === 1){
      particles.push({ x: W / 2, y: H * 0.35, text: '🌈를 먹으면 부활!', life: 2, max: 2, color: '#e078b8' });
    }
  }
  updateHUD();
  if(alivePlayers().length === 0) gameOver();
}

function finishRecord(cleared){
  lastRank = 0; lastRank2 = 0;
  players.forEach((p, i) => {
    const rec = { n: p.name, s: Math.floor(p.score), r: round, d: dodged, c: !!cleared && !p.out, t: dateStr(), m: mode };
    saveData.records.push(rec);
    saveData.records.sort((a, b) => b.s - a.s);
    if(saveData.records.length > 30) saveData.records.length = 30;
    const rk = saveData.records.indexOf(rec) + 1;
    if(i === 0) lastRank = rk; else lastRank2 = rk;
  });
  saveData.lastName = players[0].name;
  if(players[1]) saveData.lastName2 = players[1].name;
  persist();
}

function vsHTML(){
  const a = players[0], b = players[1];
  const aw = a.score >= b.score, bw = b.score >= a.score;
  return '<div class="vsBox' + (aw ? ' win' : '') + '"><div class="nm">' + esc(a.name) + '</div>' +
         '<div class="pt">' + Math.floor(a.score) + '</div><div class="sub">' + (a.out ? '💀 쓰러짐' : '❤️ ' + a.hearts) + '</div></div>' +
         '<div class="vsMid">VS</div>' +
         '<div class="vsBox' + (bw ? ' win' : '') + '"><div class="nm">' + esc(b.name) + '</div>' +
         '<div class="pt">' + Math.floor(b.score) + '</div><div class="sub">' + (b.out ? '💀 쓰러짐' : '❤️ ' + b.hearts) + '</div></div>';
}
function esc(s){
  return String(s).replace(/[&<>"']/g, ch => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[ch]));
}
function winnerLine(){
  const a = players[0], b = players[1];
  if(Math.floor(a.score) === Math.floor(b.score)) return '🤝 무승부! 똑같이 잘했어요';
  const w = a.score > b.score ? a : b;
  return '🏆 ' + w.name + ' 승리!';
}

function gameOver(){
  state = 'over';
  setHeroImgs(document.getElementById('overImgs'), 'dizzy', '🤢💫');
  playGameOver();
  finishRecord(false);
  const finalVs = document.getElementById('finalVs');
  const bigEl = document.getElementById('finalScore');
  if(mode === 2){
    document.getElementById('overTitle').textContent = '으악! 둘 다 쓰러졌다…';
    bigEl.classList.add('hidden');
    finalVs.classList.remove('hidden');
    finalVs.innerHTML = vsHTML();
    document.getElementById('finalInfo').textContent = '라운드 ' + round + ' 도달 · 피한 방귀 ' + dodged + '개';
    document.getElementById('rankInfo').textContent = winnerLine();
  } else {
    document.getElementById('overTitle').textContent = '으악! 냄새에 쓰러졌다…';
    bigEl.classList.remove('hidden');
    finalVs.classList.add('hidden');
    bigEl.textContent = Math.floor(players[0].score) + '점';
    document.getElementById('finalInfo').textContent = players[0].name + ' · 라운드 ' + round + ' 도달 · 피한 방귀 ' + dodged + '개';
    document.getElementById('rankInfo').textContent = (lastRank >= 1 && lastRank <= 10) ? '🏅 역대 ' + lastRank + '위 기록!' : '';
  }
  overScr.classList.remove('hidden');
}

function victory(){
  for(const p of players) if(!p.out) addScore(p, 2000);
  state = 'win';
  setHeroImgs(document.getElementById('winImgs'), 'happy', '🏆👑');
  playFanfare();
  spawnConfetti();
  finishRecord(true);
  const winVs = document.getElementById('winVs');
  const bigEl = document.getElementById('winScore');
  if(mode === 2){
    bigEl.classList.add('hidden');
    winVs.classList.remove('hidden');
    winVs.innerHTML = vsHTML();
    document.getElementById('winInfo').textContent = '뿡뿡제왕 격파! · 피한 방귀 ' + dodged + '개 · 생존 보너스 +2000';
    document.getElementById('winRank').textContent = winnerLine();
  } else {
    bigEl.classList.remove('hidden');
    winVs.classList.add('hidden');
    bigEl.textContent = Math.floor(players[0].score) + '점';
    document.getElementById('winInfo').textContent = players[0].name + ' · 뿡뿡제왕 격파! · 피한 방귀 ' + dodged + '개 · 보너스 +2000';
    document.getElementById('winRank').textContent = (lastRank >= 1 && lastRank <= 10) ? '🏅 역대 ' + lastRank + '위 기록!' : '';
  }
  winScr.classList.remove('hidden');
  updateHUD();
}
