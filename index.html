function renderBoard(){
  const list = document.getElementById('boardList');
  list.innerHTML = '';
  const recs = saveData.records.slice(0, 10);
  if(recs.length === 0){
    const d = document.createElement('div');
    d.className = 'emptyRow';
    d.textContent = '아직 기록이 없어요! 첫 도전자가 되어 보세요 💨';
    list.appendChild(d);
  }
  recs.forEach((r, i) => {
    const row = document.createElement('div');
    row.className = 'row' + (i === 0 ? ' top1' : '');
    const medal = document.createElement('span');
    medal.className = 'medal';
    medal.textContent = i < 3 ? ['🥇', '🥈', '🥉'][i] : (i + 1) + '위';
    const nm = document.createElement('span');
    nm.className = 'nm';
    nm.textContent = (r.m === 2 ? '👥 ' : '') + r.n;
    const sc = document.createElement('span');
    sc.className = 'sc';
    sc.textContent = r.s + '점';
    const rd = document.createElement('span');
    rd.className = 'rd';
    rd.textContent = (r.c ? '👑' : '') + 'R' + r.r + ' · ' + (r.t || '');
    row.append(medal, nm, sc, rd);
    list.appendChild(row);
  });
  const bn = document.getElementById('boardNote');
  if(storeKind === 'local'){ bn.textContent = '※ 기록은 이 기기의 브라우저에 저장돼요'; bn.style.display = 'block'; }
  else bn.style.display = hasStorage ? 'none' : 'block';
}

// ================== 그리기 도우미 ==================
function ellipseF(x, y, rx, ry){ ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, 7); ctx.fill(); }
function ellipseFS(x, y, rx, ry){ ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, 7); ctx.fill(); ctx.stroke(); }
function triS(x1, y1, x2, y2, x3, y3){
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.lineTo(x3, y3);
  ctx.closePath(); ctx.fill(); ctx.stroke();
}
function line(x1, y1, x2, y2){ ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function arcS(x, y, r, a1, a2){ ctx.beginPath(); ctx.arc(x, y, r, a1, a2); ctx.stroke(); }
function blobPath(r){
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, 7);
  ctx.arc(-r * 0.75, 3, r * 0.6, 0, 7);
  ctx.arc(r * 0.75, 3, r * 0.6, 0, 7);
  ctx.arc(0, -r * 0.5, r * 0.55, 0, 7);
}
function rrPath(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function drawStar(x, y, r, col){
  ctx.strokeStyle = col; ctx.lineWidth = 2;
  line(x - r, y, x + r, y); line(x, y - r, x, y + r);
}
function easeOutBack(t){
  const cc = 1.70158; const x = t - 1;
  return 1 + (cc + 1) * x * x * x + cc * x * x;
}

// ================== ChatGPT로 만든 그림 ==================
// assets/ 폴더의 그림을 불러와 쓰고, 그림이 없으면 예전 벡터 그림으로 그려요.
const ART = {};
const ART_REF = { p: 200, m: 190, b: 260, c: 160, i: 160 };   // 시트별 기준 높이(px)
const ART_FILES = [
  'p1_idle','p1_scared','p1_dizzy','p1_happy','p2_idle','p2_scared','p2_dizzy','p2_happy',
  'm1_idle','m2_idle','m3_idle','m4_idle','m1_charge','m2_charge','m3_charge','m4_charge',
  'm1_relief','m2_relief','m3_relief','m4_relief',
  'b1_idle','b2_idle','b3_idle','b1_charge','b2_charge','b3_charge',
  'c_normal','c_zig','c_homing','c_split','c_rocket','c_freeze','c_ghost','c_bomb',
  'c_spiral','c_boomerang','c_bolt','c_fake','c_snake','c_bounce','c_rainbow','c_gold',
  'i_shield','i_clock','i_clover','i_heart','i_crown','i_star'
];
(function loadArt(){
  for(const n of ART_FILES){
    const im = new Image();
    im.onload = () => { ART[n] = im; };
    im.src = 'assets/sprites/' + n + '.webp';
  }
  for(const n of ['bg1', 'bg2', 'bg3']){
    const im = new Image();
    im.onload = () => { ART[n] = im; };
    im.src = 'assets/' + n + '.jpg';
  }
})();
function artH(im, ref, base){ return base * im.naturalHeight / ref; }
function blit(im, cx, cy, h, ax, ay){
  const w = h * im.naturalWidth / im.naturalHeight;
  ctx.drawImage(im, cx - w * ax, cy - h * ay, w, h);
}
function setHeroImgs(el, st, fallback){
  if(!el) return;
  const ids = mode === 2 ? ['p1', 'p2'] : ['p1'];
  if(ids.every(id => ART[id + '_' + st])){
    el.innerHTML = ids.map(id => '<img src="assets/sprites/' + id + '_' + st + '.webp" alt="">').join('');
  } else el.textContent = fallback;
}

// ---------- 배경: 1~10 꽃동산 / 11~20 노을 눈꽃 언덕 / 21~30 번개 화산섬 ----------
function drawBG(t){
  const key = (state === 'start') ? 'bg1' : (round >= 21 ? 'bg3' : round >= 11 ? 'bg2' : 'bg1');
  const im = ART[key] || ART.bg1;
  if(!im){ drawBGVec(t); return; }
  const sc = Math.max(W / im.naturalWidth, H / im.naturalHeight);
  const dw = im.naturalWidth * sc, dh = im.naturalHeight * sc;
  ctx.drawImage(im, (W - dw) / 2, H - dh, dw, dh);         // 바닥선이 화면 아래에 오도록
  ctx.fillStyle = key === 'bg3' ? 'rgba(20,10,40,0.18)' : 'rgba(255,255,255,0.12)'; // 방귀가 잘 보이게 살짝 흐리게
  ctx.fillRect(0, 0, W, H);
}

// ---------- 몬스터·보스 ----------
function drawMonster(m){
  const sid = m.isBoss ? (m.boss3 ? 'b3' : m.boss2 ? 'b2' : 'b1') : ('m' + ((m.type && m.type.sid) || 1));
  let st = 'idle';
  if(m.st === 'charge') st = 'charge';
  else if(m.isBoss && (m.st === 'rapid' || m.st === 'meteor')) st = 'charge';
  else if(!m.isBoss && (m.st === 'fart' || m.st === 'rapid' || m.st === 'snakefire')) st = 'relief';
  const im = ART[sid + '_' + st] || ART[sid + '_idle'];
  if(!im){ drawMonsterVec(m); return; }
  const base = m.isBoss ? (m.boss3 ? 150 : m.boss2 ? 138 : 128) : 64;
  const h = artH(im, m.isBoss ? ART_REF.b : ART_REF.m, base);
  const shaking = (m.st === 'charge' || m.st === 'rapid' || m.st === 'meteor' || m.st === 'snakefire');
  const sx = shaking ? (Math.random() - 0.5) * (m.isBoss ? 7 : 5) : 0;
  ctx.save();
  ctx.translate(m.x + sx, m.y + 2 + Math.sin(m.bob) * 3 * (m.scale || 1));
  if(m.isBoss && m.enraged){ // 분노 오라
    const k = Math.abs(Math.sin(m.bob * 3));
    ctx.fillStyle = 'rgba(230,60,60,' + (0.10 + 0.08 * k) + ')';
    ctx.beginPath(); ctx.arc(0, 0, base * 0.55, 0, 7); ctx.fill();
    if(m.boss3 && (m.phase || 0) >= 2){
      ctx.strokeStyle = 'rgba(150,60,220,' + (0.3 + 0.2 * k) + ')'; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.arc(0, 0, base * 0.62, 0, 7); ctx.stroke();
    }
  }
  let kx = 1, ky = 1;
  if(st === 'charge'){ const q = Math.sin(performance.now() / 45) * 0.03; kx = 1.06 + q; ky = 1.03 - q; }
  else if(st === 'relief'){ kx = 1.07; ky = 0.94; }
  ctx.rotate(Math.sin(m.bob * 0.5) * 0.07);
  ctx.scale(kx, ky);
  blit(im, 0, 0, h, 0.5, 0.55);
  ctx.restore();
  if(m.st === 'charge'){ // 어떤 방귀인지 예고 아이콘
    const solid = m.isBoss ? (m.boss3 ? '#c78f1e' : m.boss2 ? '#7a3ab8' : '#e6554b')
                           : ((KIND_STYLE[m.kind] || KIND_STYLE.normal).solid);
    const iy = m.y - base * 0.66;
    ctx.save();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(m.x, iy, 11, 0, 7); ctx.fill();
    ctx.fillStyle = solid;
    ctx.beginPath(); ctx.arc(m.x, iy, 9, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = '15px "Jua",sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('!', m.x, iy + 5);
    ctx.restore();
  }
}

// ---------- 방귀 구름·아이템 ----------
const CLOUD_ART = {
  normal:'c_normal', small:'c_normal', big:'c_normal', wallseg:'c_normal', giant:'c_homing',
  zig:'c_zig', homing:'c_homing', split:'c_split', rocket:'c_rocket', freeze:'c_freeze',
  ghost:'c_ghost', bomb:'c_bomb', spiral:'c_spiral', boomerang:'c_boomerang', bolt:'c_bolt',
  fake:'c_fake', snakeb:'c_snake', bounce:'c_bounce', rainbow:'c_rainbow', gold:'c_gold',
  shield:'i_shield', clock:'i_clock', clover:'i_clover'
};
function drawCloud(c){
  const im = ART[CLOUD_ART[c.kind]];
  if(!im){ drawCloudVec(c); return; }
  const isItem = (c.kind === 'shield' || c.kind === 'clock' || c.kind === 'clover');
  const isGood = isItem || c.kind === 'rainbow' || c.kind === 'gold';
  const wob = Math.sin(c.wob) * 2;
  ctx.save();
  ctx.translate(c.x, c.y + wob);
  if(isGood){ // 좋은 아이템은 반짝이는 후광
    const k = 0.55 + 0.25 * Math.sin(c.age * 6);
    const g = ctx.createRadialGradient(0, 0, 2, 0, 0, c.r * 2);
    g.addColorStop(0, 'rgba(255,255,220,' + k + ')'); g.addColorStop(1, 'rgba(255,255,220,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, c.r * 2, 0, 7); ctx.fill();
  }
  if(c.kind === 'ghost') ctx.globalAlpha = 0.15 + 0.85 * Math.abs(Math.sin(c.age * 2.0));
  else if(c.kind === 'wallseg') ctx.globalAlpha = 0.93;
  let rot = Math.sin(c.age * 3 + c.ph) * 0.12;
  if(c.kind === 'rocket') rot = Math.atan2(c.vy, c.vx) + 0.7;   // 그림의 앞머리(오른쪽 위)를 날아가는 쪽으로
  else if(c.kind === 'spiral') rot = c.age * 4;
  else if(c.kind === 'boomerang') rot = c.age * 7;
  else if(isItem) rot = Math.sin(c.age * 2.4) * 0.18;
  ctx.rotate(rot);
  let kx = 1, ky = 1;
  if(c.kind === 'bounce'){ const q = Math.sin(c.age * 14) * 0.08; kx = 1 + q; ky = 1 - q; }
  if(c.kind === 'bomb' && c.splitY - c.y < 130){ const q = Math.abs(Math.sin(c.age * 18)) * 0.08; kx = 1 + q; ky = 1 + q; }
  ctx.scale(kx, ky);
  if(c.kind === 'fake') ctx.globalAlpha = 0.78;
  blit(im, 0, 0, c.r * (isItem ? 2.9 : 2.6) * im.naturalHeight / ART_REF.c, 0.5, 0.5);
  ctx.restore();
  if(c.kind === 'fake'){ // 가짜 방귀 힌트: 점선 테두리 + 물음표
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,0.95)'; ctx.lineWidth = 2.5; ctx.setLineDash([5, 5]);
    ctx.lineDashOffset = -c.age * 30;
    ctx.beginPath(); ctx.arc(c.x, c.y + wob, c.r * 1.45, 0, 7); ctx.stroke();
    ctx.setLineDash([]);
    ctx.font = '16px "Jua",sans-serif'; ctx.textAlign = 'center';
    ctx.lineWidth = 4; ctx.strokeStyle = '#fff'; ctx.strokeText('?', c.x + c.r * 1.2, c.y + wob - c.r);
    ctx.fillStyle = '#7a9a4a'; ctx.fillText('?', c.x + c.r * 1.2, c.y + wob - c.r);
    ctx.restore();
  }
  if(c.kind === 'bomb' && c.splitY - (c.y + wob) < 130){ // 곧 터져요!
    ctx.save();
    ctx.strokeStyle = 'rgba(230,60,50,' + (0.45 + 0.3 * Math.sin(c.age * 20)) + ')';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(c.x, c.y + wob, c.r * 1.55, 0, 7); ctx.stroke();
    ctx.restore();
  }
  if(c.kind === 'rainbow' || c.kind === 'gold'){
    const a = c.age * 3;
    drawStar(c.x + Math.cos(a) * (c.r + 12), c.y + wob + Math.sin(a) * (c.r + 12) * 0.6, 4, '#ffe27a');
    drawStar(c.x - Math.cos(a) * (c.r + 9), c.y + wob - Math.sin(a) * (c.r + 9) * 0.6, 3, '#fff');
  }
}

// ---------- 플레이어(1P 뭉치 · 2P 구름이) ----------
function drawPlayer(p, t){
  const pre = p.id === 0 ? 'p1' : 'p2';
  let near = 1e9;
  for(const c of clouds){
    if(c.kind === 'rainbow' || c.kind === 'gold' || c.kind === 'shield' || c.kind === 'clock' || c.kind === 'clover' || c.kind === 'fake') continue;
    const d = Math.hypot(c.x - p.x, c.y - p.y);
    if(d < near) near = d;
  }
  const scared = near < 130 && state === 'playing';
  let st = 'idle';
  if(p.out || p.face === 1) st = 'dizzy';
  else if(state === 'win') st = 'happy';
  else if(scared) st = 'scared';
  const im = ART[pre + '_' + st];
  if(!im){ drawPlayerVec(p, t); return; }
  const sk = p.skin;
  const h = artH(im, ART_REF.p, 62);

  if(p.out){ // 쓰러짐: 옆으로 눕고 별이 빙글빙글
    ctx.save();
    ctx.translate(p.x, p.y + 12);
    ctx.globalAlpha = 0.62;
    ctx.rotate(-1.4);
    blit(im, 0, 0, h, 0.5, 0.5);
    ctx.restore();
    ctx.save();
    const a = p.downT * 4;
    for(let i = 0; i < 3; i++){
      const ang = a + i * 2.1;
      drawStar(p.x + Math.cos(ang) * 26, p.y - 26 + Math.sin(ang) * 8, 5, '#ffd23e');
    }
    if(mode === 2){
      ctx.font = '13px "Jua","Malgun Gothic",sans-serif'; ctx.textAlign = 'center';
      ctx.fillStyle = sk.tag; ctx.fillText(p.name, p.x, p.y - 42);
    }
    ctx.restore();
    return;
  }

  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  ellipseF(0, 26, 22, 5);
  if(p.invuln > 0 && Math.floor(t * 14) % 2 === 0) ctx.globalAlpha = 0.35;
  ctx.rotate(p.tilt);
  let hop = 0;
  if(state === 'win') hop = -Math.abs(Math.sin(t * 6)) * 12;
  else if(Math.abs(p.tilt) > 0.05) hop = -Math.abs(Math.sin(t * 14)) * 3;
  blit(im, 0, 27 + hop, h, 0.5, 1);
  if(p.slowT > 0){ // ❄️ 꽁꽁
    ctx.fillStyle = 'rgba(150,210,255,0.38)';
    ctx.beginPath(); ctx.ellipse(0, 0, 25, 26, 0, 0, 7); ctx.fill();
    drawStar(-13, -16, 4, '#ffffff');
    drawStar(14, -6, 3, '#ffffff');
  }
  if(p.shield){ // 🛡 비눗방울
    ctx.strokeStyle = 'rgba(180,225,255,0.95)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, -4, 37, 0, 7); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,190,230,0.75)'; ctx.lineWidth = 2;
    arcS(0, -4, 37, -2.4, -1.4);
    ctx.fillStyle = 'rgba(190,225,255,0.14)';
    ctx.beginPath(); ctx.arc(0, -4, 37, 0, 7); ctx.fill();
  }
  if(p.feverT > 0){ // 🍀 피버 ×2
    const fa = p.feverT * 5;
    drawStar(Math.cos(fa) * 34, -6 + Math.sin(fa) * 16, 5, '#ffd23e');
    drawStar(Math.cos(fa + 3.14) * 34, -6 + Math.sin(fa + 3.14) * 16, 5, '#ffd23e');
    ctx.font = '16px "Jua",sans-serif'; ctx.textAlign = 'center';
    ctx.lineWidth = 4; ctx.strokeStyle = '#fff'; ctx.strokeText('×2', 30, -26);
    ctx.fillStyle = '#e8a020'; ctx.fillText('×2', 30, -26);
  }
  if(state === 'win' && ART.i_crown){
    blit(ART.i_crown, 0, -30 + hop, 26, 0.5, 1);
  }
  ctx.restore();

  if(mode === 2){ // 머리 위 이름표
    ctx.save();
    ctx.font = '13px "Jua","Malgun Gothic",sans-serif';
    ctx.textAlign = 'center';
    const label = (p.id === 0 ? '1P ' : '2P ') + p.name;
    const w2 = ctx.measureText(label).width + 14;
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    rrPath(p.x - w2 / 2, p.y - 66, w2, 18, 9); ctx.fill();
    ctx.fillStyle = sk.tag;
    ctx.fillText(label, p.x, p.y - 52.5);
    ctx.restore();
  }
}

// ================== 그리기 ==================
function drawBGVec(t){
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#8fd6ff'); g.addColorStop(1, '#d8f3ff');
  ctx.fillStyle = g; ctx.fillRect(-20, -20, W + 40, H + 40);
  ctx.fillStyle = '#ffe27a';
  ctx.beginPath(); ctx.arc(W - 58, 62, 28, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  for(let i = 0; i < 3; i++){
    const cx = ((t * 12 + i * 260) % (W + 160)) - 80;
    const cy = 165 + i * 60;
    ctx.beginPath();
    ctx.arc(cx, cy, 22, 0, 7);
    ctx.arc(cx + 19, cy + 4, 15, 0, 7);
    ctx.arc(cx - 19, cy + 4, 15, 0, 7);
    ctx.fill();
  }
  ctx.fillStyle = '#8ede6f';
  ctx.beginPath();
  ctx.moveTo(-20, H - 46);
  ctx.quadraticCurveTo(W / 2, H - 70, W + 20, H - 46);
  ctx.lineTo(W + 20, H + 20); ctx.lineTo(-20, H + 20);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#7ccb5e';
  ctx.fillRect(-20, H - 28, W + 40, 48);
  for(let i = 0; i < 8; i++){
    const fx = ((i * 97) % 100) / 100 * W;
    const fy = H - 38 + ((i * 53) % 16);
    ctx.fillStyle = ['#ff8fb0', '#ffd45c', '#ffffff'][i % 3];
    ctx.beginPath(); ctx.arc(fx, fy, 3, 0, 7); ctx.fill();
  }
}

function drawMonsterVec(m){
  const tp = m.type, sc = m.scale || 1;
  let face = m.st;
  if(m.isBoss) face = (m.st === 'charge') ? 'charge' : (m.st === 'rapid' ? 'fart' : 'walk');
  if(face === 'rapid') face = 'fart';
  if(face !== 'charge' && face !== 'fart') face = 'walk';
  const shaking = (m.st === 'charge' || m.st === 'rapid');
  ctx.save();
  const sx = shaking ? (Math.random() - 0.5) * (m.isBoss ? 7 : 5) : 0;
  ctx.translate(m.x + sx, m.y + Math.sin(m.bob) * 3 * sc);
  ctx.scale((m.flip || 1) * sc, sc);
  ctx.lineWidth = 3;

  if(m.isBoss && m.enraged){
    ctx.fillStyle = 'rgba(230,60,60,' + (0.10 + 0.08 * Math.abs(Math.sin(m.bob * 3))) + ')';
    ctx.beginPath(); ctx.arc(0, 0, 52, 0, 7); ctx.fill();
    if(m.boss3 && (m.phase || 0) >= 2){
      ctx.strokeStyle = 'rgba(150,60,220,' + (0.3 + 0.2 * Math.abs(Math.sin(m.bob * 4))) + ')';
      ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(0, 0, 58, 0, 7); ctx.stroke();
    }
  }
  if(m.boss3){ // 붉은 망토
    ctx.fillStyle = '#a8322e'; ctx.strokeStyle = '#7c1f1c'; ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(-24, -10);
    ctx.quadraticCurveTo(-40, 12, -34, 30);
    ctx.lineTo(34, 30);
    ctx.quadraticCurveTo(40, 12, 24, -10);
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }

  ctx.fillStyle = tp.c2;
  ellipseF(-10, 24, 7, 5); ellipseF(10, 24, 7, 5);

  ctx.fillStyle = tp.c1; ctx.strokeStyle = tp.c2;
  if(tp.ear === 'cat'){ triS(-16, -14, -24, -32, -4, -22); triS(16, -14, 24, -32, 4, -22); }
  else if(tp.ear === 'bunny'){ ellipseFS(-10, -28, 6, 13); ellipseFS(10, -28, 6, 13); }
  else if(tp.ear === 'horn'){ triS(-8, -18, -14, -34, -2, -22); triS(8, -18, 14, -34, 2, -22); }
  else { ellipseFS(-18, -14, 8, 8); ellipseFS(18, -14, 8, 8); }

  const ry = face === 'charge' ? 26 : face === 'fart' ? 20 : 23;
  ctx.fillStyle = tp.c1;
  ctx.beginPath(); ctx.ellipse(0, 2, 24, ry, 0, 0, 7); ctx.fill(); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ellipseF(0, 8, 13, ry * 0.5);

  if(face === 'charge'){
    ctx.strokeStyle = '#3b2b20'; ctx.lineWidth = 2.5;
    line(-12, -6, -6, -2); line(-12, -2, -6, -6);
    line(6, -6, 12, -2); line(6, -2, 12, -6);
    ctx.fillStyle = '#3b2b20';
    ellipseF(0, 6, 4, 5);
    ctx.fillStyle = 'rgba(255,90,90,0.6)';
    ellipseF(-15, 3, 5, 3.5); ellipseF(15, 3, 5, 3.5);
    ctx.fillStyle = '#7fd0ff';
    ellipseF(20, -14, 3, 4.5);
  } else if(face === 'fart'){
    ctx.strokeStyle = '#3b2b20'; ctx.lineWidth = 2.5;
    arcS(-9, -4, 4, Math.PI, Math.PI * 2);
    arcS(9, -4, 4, Math.PI, Math.PI * 2);
    arcS(0, 2, 7, 0.15, Math.PI - 0.15);
    ctx.fillStyle = 'rgba(255,120,120,0.5)';
    ellipseF(-15, 2, 4.5, 3); ellipseF(15, 2, 4.5, 3);
  } else {
    ctx.fillStyle = '#3b2b20';
    ctx.beginPath(); ctx.arc(-9, -4, 3, 0, 7); ctx.arc(9, -4, 3, 0, 7); ctx.fill();
    ctx.strokeStyle = '#3b2b20'; ctx.lineWidth = 2;
    arcS(0, 3, 4.5, 0.2, Math.PI - 0.2);
    ctx.fillStyle = 'rgba(255,120,120,0.45)';
    ellipseF(-14, 2, 4.5, 3); ellipseF(14, 2, 4.5, 3);
    if(m.boss2 || m.boss3){
      ctx.strokeStyle = '#3b2b20'; ctx.lineWidth = 2.5;
      line(-14, -11, -6, -8); line(14, -11, 6, -8);
    }
  }

  if(m.isBoss){
    ctx.fillStyle = m.boss3 ? '#ffcf3e' : m.boss2 ? '#e8b520' : '#ffd23e';
    ctx.strokeStyle = '#d9a410'; ctx.lineWidth = 2;
    ctx.beginPath();
    if(m.boss3){
      ctx.moveTo(-20, -26); ctx.lineTo(-20, -42); ctx.lineTo(-13, -32);
      ctx.lineTo(-7, -45); ctx.lineTo(0, -33); ctx.lineTo(7, -45);
      ctx.lineTo(13, -32); ctx.lineTo(20, -42); ctx.lineTo(20, -26);
    } else if(m.boss2){
      ctx.moveTo(-16, -26); ctx.lineTo(-16, -40); ctx.lineTo(-10, -31);
      ctx.lineTo(-5, -42); ctx.lineTo(0, -32); ctx.lineTo(5, -42);
      ctx.lineTo(10, -31); ctx.lineTo(16, -40); ctx.lineTo(16, -26);
    } else {
      ctx.moveTo(-14, -26); ctx.lineTo(-14, -38); ctx.lineTo(-7, -30);
      ctx.lineTo(0, -40); ctx.lineTo(7, -30); ctx.lineTo(14, -38); ctx.lineTo(14, -26);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = m.boss3 ? '#e2352c' : m.boss2 ? '#8a3ae0' : '#e2574c';
    ctx.beginPath(); ctx.arc(0, -32, 2.5, 0, 7); ctx.fill();
    if(m.boss3){
      ctx.fillStyle = '#3d7fb8';
      ctx.beginPath(); ctx.arc(-12, -31, 2, 0, 7); ctx.arc(12, -31, 2, 0, 7); ctx.fill();
    }
  }

  if(m.st === 'charge'){
    const solid = m.isBoss ? (m.boss3 ? '#c78f1e' : m.boss2 ? '#7a3ab8' : '#e6554b')
                           : ((KIND_STYLE[m.kind] || KIND_STYLE.normal).solid);
    const iy = m.isBoss ? -58 : -46;
    ctx.fillStyle = solid;
    ctx.beginPath(); ctx.arc(0, iy, 9, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = '900 13px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('!', 0, iy + 5);
  }
  ctx.restore();
}

function drawCloudVec(c){
  const w = Math.sin(c.wob) * 2;
  ctx.save();
  ctx.translate(c.x, c.y + w);

  if(c.kind === 'rainbow'){
    const g = ctx.createRadialGradient(0, 0, 2, 0, 0, c.r + 8);
    g.addColorStop(0, 'rgba(255,255,255,0.95)');
    g.addColorStop(0.35, 'rgba(255,220,120,0.9)');
    g.addColorStop(0.6, 'rgba(255,160,190,0.85)');
    g.addColorStop(0.85, 'rgba(150,215,255,0.8)');
    g.addColorStop(1, 'rgba(200,170,255,0.5)');
    ctx.fillStyle = g;
    blobPath(c.r); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 2;
    blobPath(c.r + 2); ctx.stroke();
    ctx.strokeStyle = 'rgba(200,90,150,0.95)'; ctx.lineWidth = 2;
    arcS(-5, -3, 3, Math.PI, Math.PI * 2);
    arcS(5, -3, 3, Math.PI, Math.PI * 2);
    arcS(0, 2, 4, 0.2, Math.PI - 0.2);
    const a = c.age * 3;
    const sx = Math.cos(a) * (c.r + 9), sy = Math.sin(a) * (c.r + 9) * 0.6;
    drawStar(sx, sy, 4, '#ffe27a');
    drawStar(-sx * 0.7, -sy * 0.7, 3, '#fff');
    ctx.restore();
    return;
  }
  if(c.kind === 'gold'){
    const g = ctx.createRadialGradient(0, 0, 2, 0, 0, c.r + 7);
    g.addColorStop(0, 'rgba(255,255,255,0.95)');
    g.addColorStop(0.4, 'rgba(255,224,120,0.95)');
    g.addColorStop(0.8, 'rgba(240,175,50,0.9)');
    g.addColorStop(1, 'rgba(200,140,30,0.5)');
    ctx.fillStyle = g;
    blobPath(c.r); ctx.fill();
    ctx.strokeStyle = 'rgba(255,246,200,0.9)'; ctx.lineWidth = 2;
    blobPath(c.r + 2); ctx.stroke();
    drawStar(-5, -3, 2.6, '#8a5a00');
    drawStar(5, -3, 2.6, '#8a5a00');
    ctx.strokeStyle = '#8a5a00'; ctx.lineWidth = 1.6;
    arcS(0, 3, 4, 0.2, Math.PI - 0.2);
    const a = c.age * 4;
    drawStar(Math.cos(a) * (c.r + 8), Math.sin(a) * (c.r + 8) * 0.6, 4, '#ffe27a');
    ctx.restore();
    return;
  }
  if(c.kind === 'shield'){
    ctx.fillStyle = 'rgba(190,228,255,0.20)';
    ctx.beginPath(); ctx.arc(0, 0, c.r, 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.95)'; ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.arc(0, 0, c.r, 0, 7); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,170,220,0.75)'; ctx.lineWidth = 2;
    arcS(0, 0, c.r - 3, -2.5, -1.2);
    ctx.strokeStyle = 'rgba(140,210,255,0.75)';
    arcS(0, 0, c.r - 3, 0.6, 1.8);
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ellipseF(-c.r * 0.4, -c.r * 0.45, 3, 1.8);
    ctx.fillStyle = '#3a7ab0';
    ctx.beginPath(); ctx.arc(-4, -2, 1.8, 0, 7); ctx.arc(4, -2, 1.8, 0, 7); ctx.fill();
    ctx.strokeStyle = '#3a7ab0'; ctx.lineWidth = 1.6;
    arcS(0, 2, 3.5, 0.2, Math.PI - 0.2);
    ctx.restore();
    return;
  }
  if(c.kind === 'clock'){ // ⏰ 시계 방귀
    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    ctx.beginPath(); ctx.arc(0, 0, c.r, 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(140,190,255,0.6)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, c.r + 4, 0, 7); ctx.stroke();
    ctx.strokeStyle = '#4a7ab8'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(0, 0, c.r, 0, 7); ctx.stroke();
    ctx.lineWidth = 2;
    for(let ti = 0; ti < 4; ti++){
      const ta = ti * Math.PI / 2;
      line(Math.cos(ta) * (c.r - 3), Math.sin(ta) * (c.r - 3), Math.cos(ta) * (c.r - 6), Math.sin(ta) * (c.r - 6));
    }
    const ha = c.age * 2, ma = c.age * 5;
    ctx.lineWidth = 2.5;
    line(0, 0, Math.cos(ha) * (c.r - 8), Math.sin(ha) * (c.r - 8));
    ctx.lineWidth = 2;
    line(0, 0, Math.cos(ma) * (c.r - 5), Math.sin(ma) * (c.r - 5));
    ctx.restore();
    return;
  }
  if(c.kind === 'clover'){ // 🍀 클로버 방귀
    ctx.fillStyle = 'rgba(240,255,240,0.9)';
    blobPath(c.r); ctx.fill();
    ctx.fillStyle = '#4fae3f';
    const lr = c.r * 0.42;
    ellipseF(-lr * 0.8, -lr * 0.8, lr, lr);
    ellipseF(lr * 0.8, -lr * 0.8, lr, lr);
    ellipseF(-lr * 0.8, lr * 0.8, lr, lr);
    ellipseF(lr * 0.8, lr * 0.8, lr, lr);
    ctx.strokeStyle = '#3a8a2e'; ctx.lineWidth = 2;
    line(1, 2, 5, c.r + 4);
    drawStar(-c.r * 0.5, -c.r - 3, 3, '#ffe27a');
    ctx.restore();
    return;
  }

  if(c.kind === 'ghost') ctx.globalAlpha = 0.12 + 0.88 * Math.abs(Math.sin(c.age * 2.0));

  const stl = KIND_STYLE[c.kind] || KIND_STYLE.normal;
  const g = ctx.createRadialGradient(0, 0, 2, 0, 0, c.r + 6);
  g.addColorStop(0, stl.a); g.addColorStop(1, stl.b);
  ctx.fillStyle = g;
  blobPath(c.r); ctx.fill();

  ctx.save();
  const fs = c.r / 16;
  ctx.scale(fs, fs);
  ctx.strokeStyle = stl.f; ctx.fillStyle = stl.f; ctx.lineWidth = 1.5;
  if(c.kind === 'ghost'){
    ctx.beginPath(); ctx.arc(-5, -3, 2.2, 0, 7); ctx.stroke();
    ctx.beginPath(); ctx.arc(5, -3, 2.2, 0, 7); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-5, 3); ctx.quadraticCurveTo(-3, 1, -1, 3);
    ctx.quadraticCurveTo(1, 5, 3, 3); ctx.quadraticCurveTo(4, 2, 5, 3);
    ctx.stroke();
  } else if(c.kind === 'homing' || c.kind === 'giant'){
    ctx.beginPath(); ctx.arc(-5, -3, 2, 0, 7); ctx.arc(5, -3, 2, 0, 7); ctx.fill();
    line(-8, -7, -3, -5); line(8, -7, 3, -5);
    arcS(0, 5, 3.5, Math.PI, Math.PI * 2);
  } else if(c.kind === 'fake'){
    arcS(-5, -3, 2.5, Math.PI, Math.PI * 2);
    ctx.beginPath(); ctx.arc(5, -3, 2, 0, 7); ctx.fill();
    arcS(0, 1, 3.5, 0.2, Math.PI - 0.2);
    ctx.fillStyle = '#ff9fb0';
    ellipseF(2, 5, 2, 3);
    ctx.fillStyle = stl.f;
  } else if(c.kind === 'boomerang'){
    arcS(-5, -3, 2.5, Math.PI, Math.PI * 2);
    ctx.beginPath(); ctx.arc(5, -3, 2, 0, 7); ctx.fill();
    arcS(0, 2, 4, 0.2, Math.PI - 0.2);
  } else {
    ctx.beginPath(); ctx.arc(-5, -3, 2, 0, 7); ctx.arc(5, -3, 2, 0, 7); ctx.fill();
    arcS(0, 2, 4, 0.2, Math.PI - 0.2);
  }
  ctx.restore();

  ctx.strokeStyle = stl.f; ctx.globalAlpha *= 0.55; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-c.r - 4, -6); ctx.quadraticCurveTo(-c.r - 9, -2, -c.r - 4, 2);
  ctx.moveTo(c.r + 4, -6); ctx.quadraticCurveTo(c.r + 9, -2, c.r + 4, 2);
  ctx.stroke();
  ctx.globalAlpha = c.kind === 'ghost' ? 0.12 + 0.88 * Math.abs(Math.sin(c.age * 2.0)) : 1;

  if(c.kind === 'rocket'){
    const vlen = Math.hypot(c.vx, c.vy) || 1;
    const ux = -c.vx / vlen, uy = -c.vy / vlen;
    ctx.strokeStyle = 'rgba(230,85,75,0.5)'; ctx.lineWidth = 2;
    for(let i = -1; i <= 1; i++){
      const px = ux * 14 + i * uy * 7, py = uy * 14 - i * ux * 7;
      line(px, py, px + ux * 12, py + uy * 12);
    }
  }
  if(c.kind === 'freeze'){
    drawStar(0, -c.r - 6, 4, '#ffffff');
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.6;
    line(-3, -c.r - 9, 3, -c.r - 3);
    line(3, -c.r - 9, -3, -c.r - 3);
  }
  if(c.kind === 'spiral'){
    ctx.strokeStyle = 'rgba(70,100,220,0.55)'; ctx.lineWidth = 2;
    const aa = c.age * 5;
    arcS(0, 0, c.r + 5, aa, aa + 1.3);
    arcS(0, 0, c.r + 5, aa + Math.PI, aa + Math.PI + 1.3);
  }
  if(c.kind === 'bomb'){
    drawStar(0, -c.r - 5, 3 + Math.abs(Math.sin(c.age * 18)) * 2, '#ff8a3c');
    if(c.splitY - (c.y + w) < 130){
      ctx.strokeStyle = 'rgba(230,60,50,' + (0.4 + 0.3 * Math.sin(c.age * 20)) + ')';
      ctx.lineWidth = 3;
      blobPath(c.r + 4); ctx.stroke();
    }
  }
  if(c.kind === 'fake'){ // 가짜! 점선 테두리 힌트
    ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 2;
    ctx.setLineDash([5, 5]);
    blobPath(c.r + 3); ctx.stroke();
    ctx.setLineDash([]);
  }
  if(c.kind === 'bolt'){ // ⚡ 번개 무늬
    ctx.strokeStyle = '#8a6a00'; ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(-4, -7); ctx.lineTo(2, -1); ctx.lineTo(-2, 1); ctx.lineTo(4, 7);
    ctx.stroke();
  }
  if(c.kind === 'snakeb'){ // 🐍 송곳니
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.moveTo(-4, 6); ctx.lineTo(-2, 10); ctx.lineTo(0, 6); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(0, 6); ctx.lineTo(2, 10); ctx.lineTo(4, 6); ctx.closePath(); ctx.fill();
  }
  if(c.kind === 'bounce'){ // 스프링 자국
    ctx.strokeStyle = 'rgba(238,110,140,0.7)'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-8, c.r + 4); ctx.lineTo(-4, c.r + 8); ctx.lineTo(0, c.r + 4);
    ctx.lineTo(4, c.r + 8); ctx.lineTo(8, c.r + 4);
    ctx.stroke();
  }
  ctx.restore();
}

function drawPlayerVec(p, t){
  const sk = p.skin;
  ctx.save();

  if(p.out){ // 쓰러진 상태: 옆으로 눕고 별이 빙글빙글
    ctx.translate(p.x, p.y + 8);
    ctx.globalAlpha = 0.55;
    ctx.rotate(-1.35);
    ctx.fillStyle = 'rgba(0,0,0,0.10)';
    ellipseF(0, 26, 20, 5);
    ctx.lineWidth = 3;
    ctx.fillStyle = sk.body; ctx.strokeStyle = sk.line;
    ctx.beginPath(); ctx.ellipse(0, 0, 20, 22, 0, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = sk.foot;
    ellipseF(-8, 21, 6, 4); ellipseF(8, 21, 6, 4);
    ctx.strokeStyle = '#3b2b20'; ctx.lineWidth = 2.5;
    line(-11, -6, -5, 0); line(-11, 0, -5, -6);
    line(5, -6, 11, 0); line(5, 0, 11, -6);
    ctx.fillStyle = '#ff8f9f';
    ellipseF(0, 10, 4, 6);
    ctx.restore();
    ctx.save();
    ctx.globalAlpha = 0.9;
    const a = p.downT * 4;
    for(let i = 0; i < 3; i++){
      const ang = a + i * 2.1;
      drawStar(p.x + Math.cos(ang) * 24, p.y - 32 + Math.sin(ang) * 8, 4, '#ffd23e');
    }
    ctx.font = '900 12px "Malgun Gothic",sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = sk.tag;
    if(mode === 2) ctx.fillText(p.name, p.x, p.y - 46);
    ctx.restore();
    return;
  }

  if(p.invuln > 0 && Math.floor(t * 14) % 2 === 0) ctx.globalAlpha = 0.35;
  ctx.translate(p.x, p.y);
  ctx.rotate(p.tilt);

  let near = 1e9;
  for(const c of clouds){
    if(c.kind === 'rainbow' || c.kind === 'gold' || c.kind === 'shield') continue;
    const d = Math.hypot(c.x - p.x, c.y - p.y);
    if(d < near) near = d;
  }
  const scared = near < 130 && state === 'playing';

  ctx.fillStyle = 'rgba(0,0,0,0.12)';
  ellipseF(0, 26, 20, 5);
  ctx.lineWidth = 2.5;
  if(sk.ear === 'cat'){ // 2P 고양이 귀
    ctx.fillStyle = sk.earA; ctx.strokeStyle = sk.earAL;
    triS(-16, -14, -22, -32, -4, -22);
    ctx.fillStyle = sk.earB; ctx.strokeStyle = sk.earBL;
    triS(16, -14, 22, -32, 4, -22);
  } else { // 1P 강아지 귀
    ctx.fillStyle = sk.earA; ctx.strokeStyle = sk.earAL;
    ctx.beginPath(); ctx.ellipse(-16, -12, 7, 12, -0.45, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = sk.earB; ctx.strokeStyle = sk.earBL;
    ctx.beginPath(); ctx.ellipse(16, -12, 7, 12, 0.45, 0, 7); ctx.fill(); ctx.stroke();
  }
  ctx.fillStyle = sk.body; ctx.strokeStyle = sk.line; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.ellipse(0, 0, 20, 22, 0, 0, 7); ctx.fill(); ctx.stroke();
  ctx.fillStyle = sk.foot;
  ellipseF(-8, 21, 6, 4); ellipseF(8, 21, 6, 4);

  if(p.face === 1){
    ctx.fillStyle = 'rgba(140,200,90,0.35)';
    ctx.beginPath(); ctx.ellipse(0, 0, 20, 22, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = '#3b2b20'; ctx.lineWidth = 2.5;
    line(-11, -6, -5, 0); line(-11, 0, -5, -6);
    line(5, -6, 11, 0); line(5, 0, 11, -6);
    ctx.fillStyle = '#ff8f9f';
    ellipseF(0, 10, 4, 6);
  } else if(state === 'win'){
    ctx.strokeStyle = '#3b2b20'; ctx.lineWidth = 2.5;
    arcS(-8, -4, 4, Math.PI, Math.PI * 2);
    arcS(8, -4, 4, Math.PI, Math.PI * 2);
    arcS(0, 4, 7, 0.15, Math.PI - 0.15);
    ctx.fillStyle = 'rgba(255,120,120,0.5)';
    ellipseF(-14, 3, 4.5, 3); ellipseF(14, 3, 4.5, 3);
  } else {
    const er = scared ? 4.4 : 3.2;
    ctx.fillStyle = '#3b2b20';
    ctx.beginPath(); ctx.arc(-8, -4, er, 0, 7); ctx.arc(8, -4, er, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-9, -5, 1.4, 0, 7); ctx.arc(7, -5, 1.4, 0, 7); ctx.fill();
    ctx.fillStyle = '#5a3e2b';
    ellipseF(0, 2, 3, 2.2);
    ctx.strokeStyle = '#3b2b20'; ctx.lineWidth = 2;
    if(scared){
      ctx.beginPath(); ctx.ellipse(0, 9, 4, 3.4, 0, 0, 7); ctx.stroke();
      ctx.fillStyle = '#7fd0ff';
      ellipseF(16, -14, 2.6, 4);
    } else {
      arcS(0, 6, 5, 0.25, Math.PI - 0.25);
    }
  }
  if(p.slowT > 0){
    ctx.fillStyle = 'rgba(120,190,235,0.30)';
    ctx.beginPath(); ctx.ellipse(0, 0, 20, 22, 0, 0, 7); ctx.fill();
    drawStar(-10, -14, 3, '#e8f8ff');
    drawStar(11, -8, 2.5, '#e8f8ff');
  }
  if(p.shield){
    ctx.strokeStyle = 'rgba(180,225,255,0.9)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, -2, 32, 0, 7); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,190,230,0.7)'; ctx.lineWidth = 2;
    arcS(0, -2, 32, -2.4, -1.4);
    ctx.fillStyle = 'rgba(190,225,255,0.14)';
    ctx.beginPath(); ctx.arc(0, -2, 32, 0, 7); ctx.fill();
  }
  if(p.feverT > 0){ // 🍀 피버 ×2 반짝반짝
    const fa = p.feverT * 5;
    drawStar(Math.cos(fa) * 30, -4 + Math.sin(fa) * 14, 4, '#ffd23e');
    drawStar(Math.cos(fa + 3.14) * 30, -4 + Math.sin(fa + 3.14) * 14, 4, '#ffd23e');
    ctx.font = '900 13px "Malgun Gothic",sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#e8a020';
    ctx.fillText('×2', 0, -34);
  }
  if(state === 'win'){
    ctx.fillStyle = '#ffd23e'; ctx.strokeStyle = '#d9a410'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-10, -20); ctx.lineTo(-10, -31); ctx.lineTo(-4, -25);
    ctx.lineTo(0, -33); ctx.lineTo(4, -25); ctx.lineTo(10, -31); ctx.lineTo(10, -20);
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  ctx.restore();

  if(mode === 2){ // 머리 위 이름표
    ctx.save();
    ctx.font = '900 12px "Malgun Gothic",sans-serif';
    ctx.textAlign = 'center';
    const label = (p.id === 0 ? '1P ' : '2P ') + p.name;
    const w2 = ctx.measureText(label).width + 12;
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    rrPath(p.x - w2 / 2, p.y - 62, w2, 17, 8); ctx.fill();
    ctx.fillStyle = sk.tag;
    ctx.fillText(label, p.x, p.y - 49.5);
    ctx.restore();
  }
}

function drawTextParticle(p){
  ctx.save();
  ctx.globalAlpha = Math.max(0, p.life / (p.max || 0.9));
  const fs = p.big ? 30 : 22;
  ctx.font = fs + 'px "Jua","Malgun Gothic",sans-serif';
  ctx.textAlign = 'center';
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 5;
  ctx.strokeText(p.text, p.x, p.y);
  ctx.fillStyle = p.color || '#4d8f1f';
  ctx.fillText(p.text, p.x, p.y);
  ctx.restore();
}

function drawPuff(p){
  ctx.save();
  ctx.globalAlpha = Math.max(0, p.life / 0.6) * 0.7;
  ctx.fillStyle = p.col || '#d6f0a8';
  ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
  ctx.restore();
}

const CONF_COLS = ['#ff9fb6', '#ffd45c', '#9fdc70', '#8fd0ff', '#bda2ff', '#ffb27a'];
function makeConfetti(x, y){
  return { x, y, vx: rnd(-40, 40), vy: rnd(60, 150), rot: rnd(0, 6.28), vr: rnd(-4, 4),
           col: CONF_COLS[(Math.random() * 6) | 0], life: rnd(3, 5) };
}
function spawnConfetti(){
  for(let i = 0; i < 90; i++) confetti.push(makeConfetti(Math.random() * W, -20 - Math.random() * H * 0.5));
}

function drawBanner(){
  const total = 2.3;
  const prog = 1 - Math.max(0, introT) / total;
  const pop = Math.min(1, prog * 3.5);
  const s = 0.6 + 0.4 * easeOutBack(pop);
  const fade = introT < 0.35 ? Math.max(0, introT) / 0.35 : 1;
  ctx.save();
  ctx.globalAlpha = fade;
  ctx.translate(W / 2, H * 0.34);
  ctx.scale(s, s);
  const bw = Math.min(W - 56, 330), bh = 104;
  ctx.fillStyle = '#fffef5'; ctx.strokeStyle = '#5a3e2b'; ctx.lineWidth = 5;
  rrPath(-bw / 2, -bh / 2, bw, bh, 20); ctx.fill(); ctx.stroke();
  ctx.textAlign = 'center';
  ctx.fillStyle = round === 30 ? '#c0392b' : round === 20 ? '#7a3ab8' : '#e2574c';
  ctx.font = '34px "Jua","Malgun Gothic",sans-serif';
  ctx.fillText(round === 30 ? '🔥 최종 보스' : round === 20 ? '😈 대마왕' : round === 10 ? '👑 중간 보스' : '라운드 ' + round, 0, -6);
  ctx.fillStyle = '#7a6a55';
  ctx.font = '800 14px "Malgun Gothic",sans-serif';
  ctx.fillText(bannerMsg, 0, 26);
  ctx.restore();
}

function drawWallWarn(t){
  const a = 0.22 + 0.18 * Math.sin(t * 14);
  ctx.fillStyle = 'rgba(230,80,70,' + a + ')';
  const gs = [...wallGaps].sort((x, y) => x - y);
  let sx = 0;
  for(const g of gs){
    ctx.fillRect(sx, 52, Math.max(0, g - wallGapHalf - sx), 40);
    sx = g + wallGapHalf;
  }
  ctx.fillRect(sx, 52, Math.max(0, W - sx), 40);
  ctx.fillStyle = '#4fae3f';
  for(const g of gs){
    ctx.beginPath();
    ctx.moveTo(g - 12, 58); ctx.lineTo(g + 12, 58); ctx.lineTo(g, 84);
    ctx.closePath(); ctx.fill();
  }
}

function drawLightCol(x, k){ // ⚡ 번개 예고 기둥
  ctx.save();
  ctx.fillStyle = 'rgba(255,220,80,' + (0.10 + 0.16 * k) + ')';
  ctx.fillRect(x - 17, 96, 34, H - 96);
  ctx.strokeStyle = 'rgba(240,190,40,' + (0.3 + 0.4 * k) + ')';
  ctx.lineWidth = 2;
  ctx.setLineDash([8, 8]);
  line(x, 100, x, H - 30);
  ctx.setLineDash([]);
  ctx.strokeStyle = '#f2c521'; ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(x - 5, 106); ctx.lineTo(x + 2, 118); ctx.lineTo(x - 2, 118); ctx.lineTo(x + 5, 130);
  ctx.stroke();
  ctx.restore();
}

function draw(t){
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  if(shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  drawBG(t);
  for(const m of monsters) drawMonster(m);
  for(const m of monsters){ // 로켓 조준선 · 번개 예고 기둥
    if(!m.isBoss && m.st === 'charge' && m.kind === 'rocket'){
      const tp = (players[m.tgtId] && !players[m.tgtId].out) ? players[m.tgtId] : players[0];
      ctx.save();
      ctx.strokeStyle = 'rgba(230,70,60,0.4)'; ctx.lineWidth = 2;
      ctx.setLineDash([6, 6]);
      line(m.x, m.y + 20, tp.x, tp.y - 6);
      ctx.restore();
    }
    if(!m.isBoss && m.st === 'charge' && m.kind === 'lightning' && m.aimX !== undefined){
      drawLightCol(m.aimX, 0.5 + 0.5 * Math.sin(t * 12));
    }
  }
  for(const lw of lightWarns) drawLightCol(lw.x, 1 - Math.max(0, lw.t) / 0.9);
  for(const p of puffs) drawPuff(p);
  for(const c of clouds) drawCloud(c);
  for(const p of players) drawPlayer(p, t);
  for(const p of particles) drawTextParticle(p);
  for(const p of confetti){
    ctx.save();
    ctx.globalAlpha = Math.min(1, p.life);
    ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    ctx.fillStyle = p.col;
    ctx.fillRect(-5, -2.5, 10, 5);
    ctx.restore();
  }
  if(wallPending) drawWallWarn(t);
  if(slowMoT > 0){ // ⏰ 슬로우 모션 연출
    ctx.fillStyle = 'rgba(120,170,255,0.10)';
    ctx.fillRect(-20, -20, W + 40, H + 40);
    ctx.strokeStyle = 'rgba(150,200,255,' + (0.35 + 0.25 * Math.sin(t * 8)) + ')';
    ctx.lineWidth = 6;
    ctx.strokeRect(5, 5, W - 10, H - 10);
  }
  if(state === 'playing'){ // ❤️ 1개 남으면 위험 경고 테두리
    let danger = false;
    for(const p of players) if(!p.out && p.hearts === 1) danger = true;
    if(danger){
      ctx.strokeStyle = 'rgba(230,60,50,' + (0.12 + 0.14 * Math.abs(Math.sin(t * 6))) + ')';
      ctx.lineWidth = 10;
      ctx.strokeRect(5, 5, W - 10, H - 10);
    }
  }
  if(state === 'intro') drawBanner();
  ctx.restore();
}

// ================== 대기 상태 ==================
function idleWalk(dt){
  for(const m of monsters){
    m.bob += dt * 3;
    if(m.isBoss){
      m.sway += dt;
      m.x = W / 2 + Math.sin(m.sway * 0.8) * (W * 0.16);
      continue;
    }
    if(m.st !== 'walk') m.st = 'walk';
    m.x += m.vx * dt * 0.6;
    if(m.x < 40){ m.x = 40; m.vx = Math.abs(m.vx); }
    if(m.x > W - 40){ m.x = W - 40; m.vx = -Math.abs(m.vx); }
    m.flip = m.vx >= 0 ? 1 : -1;
  }
  for(const p of players){ p.y = H - 64; if(p.out) p.downT += dt; }
}

function updateFx(dt){
  if(shake > 0) shake = Math.max(0, shake - dt * 30);
  for(let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.y -= 30 * dt; p.life -= dt;
    if(p.life <= 0) particles.splice(i, 1);
  }
  for(let i = puffs.length - 1; i >= 0; i--){
    const p = puffs[i];
    p.r += 40 * dt; p.life -= dt;
    if(p.life <= 0) puffs.splice(i, 1);
  }
  for(let i = confetti.length - 1; i >= 0; i--){
    const p = confetti[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 25 * dt; p.rot += p.vr * dt; p.life -= dt;
    if(p.life <= 0 || p.y > H + 30) confetti.splice(i, 1);
  }
  if(state === 'win' && Math.random() < dt * 6) confetti.push(makeConfetti(Math.random() * W, -15));
}

// ================== 메인 루프 ==================
let lastT = 0;
function loop(ts){
  requestAnimationFrame(loop);
  if(!lastT) lastT = ts;
  let dt = (ts - lastT) / 1000;
  lastT = ts;
  if(dt > 0.05) dt = 0.05;
  if(state === 'playing') update(dt);
  else if(state === 'intro'){
    introT -= dt;
    idleWalk(dt);
    movePlayers(dt);
    if(introT <= 0) state = 'playing';
    updateHUD();
  } else {
    idleWalk(dt);
  }
  updateFx(dt);
  draw(ts / 1000);
}

// ================== 모드 선택 ==================
const mode1Btn = document.getElementById('mode1');
const mode2Btn = document.getElementById('mode2');
const howto = document.getElementById('howto');
function setMode(m){
  mode = m;
  mode1Btn.classList.toggle('sel', m === 1);
  mode2Btn.classList.toggle('sel', m === 2);
  name2Input.classList.toggle('hidden', m !== 2);
  nameInput.placeholder = m === 2 ? '1P 이름 (최대 8자)' : '이름을 입력하세요 (최대 8자)';
  howto.innerHTML = m === 2
    ? '둘이 함께 라운드 30까지! <b>점수가 높은 쪽이 승리</b>🏆<br>' +
      '친구가 쓰러져도 🌈를 먹으면 <b>부활</b>!<br>' +
      '⏰시계=슬로우 · 🍀클로버=점수×2 · 🤡가짜방귀는 만지면 +5<br>' +
      '🕹️ <b>1P: A D</b> 키 · <b>2P: ← →</b> 방향키 · 📱 각자 드래그'
    : '라운드 30 대장정! <b>보스가 3명!</b> 🔥<br>' +
      '🌈회복 · ✨+100 · 🛡️방패 · ⏰슬로우 · 🍀점수×2<br>' +
      '🕹️ <b>← →</b> 또는 <b>A D</b> 키, 손가락 드래그';
  players.forEach(p => { p.y = H - 64; });
  p1Who.textContent = m === 2 ? '1P' : '점수';
  p2El.classList.toggle('hidden', m !== 2);
  updateHUD();
}
mode1Btn.addEventListener('click', () => setMode(1));
mode2Btn.addEventListener('click', () => setMode(2));

// ================== 시작/버튼 ==================
function startGame(){
  ensureAudio();
  keys.p1L = keys.p1R = keys.p2L = keys.p2R = false;
  drags.clear();
  resetAll();
  startScr.classList.add('hidden');
  overScr.classList.add('hidden');
  winScr.classList.add('hidden');
  boardScr.classList.add('hidden');
  startRound(1);
  playFartP('normal');
}
document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('retryBtn').addEventListener('click', startGame);
document.getElementById('winBtn').addEventListener('click', startGame);
document.querySelectorAll('.openBoard').forEach(b => b.addEventListener('click', () => {
  renderBoard();
  boardScr.classList.remove('hidden');
}));
document.getElementById('boardClose').addEventListener('click', () => boardScr.classList.add('hidden'));
document.getElementById('muteBtn').addEventListener('click', e => {
  muted = !muted;
  e.target.textContent = muted ? '🔇' : '🔊';
});

resetAll();
setMode(1);
state = 'start';
requestAnimationFrame(loop);
</script>
